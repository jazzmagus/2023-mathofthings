{{/* Restyle the navbar brand to match the homepage hero title font treatment. */}}
<script>
  (function () {
    document.querySelectorAll('.navbar-brand').forEach(function (el) {
      if (el.querySelector('img')) return; // skip if a logo image is set
      var text = el.textContent.trim();
      var html = text
        .replace(/Math/, '<span class="math-word">Math</span>')
        .replace(/Things/, '<em>Things</em>');
      el.innerHTML = html;
    });
  })();
</script>

{{/* Theme toggle: convert dropdown to simple light/dark toggle */}}
<style>
  /* Hide theme dropdown menu */
  .dropdown-menu[aria-labelledby="theme-selector"],
  .navbar .nav-item .dropdown-menu {
    display: none !important;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Find theme toggle button
    const themeBtn = document.querySelector('button[aria-label*="theme"], a[aria-label*="theme"], .navbar-nav .nav-item:last-child .nav-link');

    if (themeBtn) {
      themeBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();

        // Get current theme
        const htmlElement = document.documentElement;
        const currentTheme = htmlElement.getAttribute('data-wc-theme') || 'light';

        // Toggle to opposite theme
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';

        // Find and click the corresponding menu item in the dropdown
        // The dropdown should have links with data-wc-theme attribute
        const themeLinks = document.querySelectorAll('.dropdown-menu a[data-wc-theme]');

        for (let link of themeLinks) {
          if (link.getAttribute('data-wc-theme') === newTheme) {
            // Click the link to trigger wowchemy's theme change
            link.click();
            break;
          }
        }

        // Fallback: if links not found, set theme directly
        if (themeLinks.length === 0) {
          htmlElement.setAttribute('data-wc-theme', newTheme);
          localStorage.setItem('wcTheme', newTheme);
        }
      });
    }
  });
</script>
