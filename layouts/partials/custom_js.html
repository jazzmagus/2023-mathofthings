{{/* Restyle the navbar brand to match the homepage hero title font treatment. */}}
<script>
  (function () {
    document.querySelectorAll('.navbar-brand').forEach(function (el) {
      if (el.querySelector('img')) return; // skip if a logo image is set
      var text = el.textContent.trim();
      var html = text
        .replace(/Math/, '<span class="math-word">Math</span>')
        .replace(/Things/, '<em>Things</em>');
      el.innerHTML = html;
    });
  })();
</script>

{{/* Theme toggle: convert dropdown to simple light/dark toggle */}}
<style>
  /* Hide theme dropdown menu */
  .dropdown-menu[aria-labelledby="theme-selector"],
  .navbar .nav-item .dropdown-menu {
    display: none !important;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Find theme toggle button by looking for moon/sun icon or aria-label
    const themeBtn = document.querySelector('[aria-label*="theme"], [aria-label*="dark"], [aria-label*="light"], .navbar-nav .nav-item:last-child .nav-link');

    if (themeBtn) {
      themeBtn.addEventListener('click', function(e) {
        // Prevent dropdown from opening
        e.preventDefault();
        e.stopPropagation();

        // Get current theme from html element or localStorage
        const htmlElement = document.documentElement;
        const currentTheme = htmlElement.getAttribute('data-wc-theme') || localStorage.getItem('wcTheme') || 'light';

        // Toggle between light and dark
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';

        // Set new theme in HTML attribute
        htmlElement.setAttribute('data-wc-theme', newTheme);

        // Save to localStorage
        localStorage.setItem('wcTheme', newTheme);

        // Trigger theme change event if exists
        if (window.getColorScheme) {
          window.getColorScheme(newTheme);
        }

        // Update icon
        const icon = themeBtn.querySelector('i');
        if (icon) {
          icon.className = newTheme === 'light'
            ? 'fas fa-moon'
            : 'fas fa-sun';
        }
      });
    }
  });
</script>
