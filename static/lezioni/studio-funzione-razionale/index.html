document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Studio di una Funzione Reale di Variabile Reale<\u002Ftitle>\n\n\n\n<style>\n  @font-face {\n    font-family: 'Georgia';\n    src: local('Georgia'), serif;\n  }\n  \n  @font-face {\n    font-family: 'JetBrains Mono';\n    src: local('JetBrains Mono'), monospace;\n  }\n  \n  body { \n    margin: 0; \n    background: #fafafa;\n    font-family: Georgia, serif;\n    font-size: 15px;\n    line-height: 1.65;\n    color: #2c2c2c;\n  }\n  \n  .doc { \n    box-sizing: border-box; \n    max-width: 8.5in; \n    margin: 0 auto;\n    background: inherit;\n    padding: 48px clamp(24px, 5vw, 0.75in) 96px; \n  }\n  \n  /* Title section */\n  .title-section {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 32px;\n    margin-bottom: 40px;\n    align-items: flex-start;\n  }\n  \n  .title-left h1 {\n    margin: 0;\n    font-size: 4em;\n    line-height: 1.25;\n    text-wrap: balance;\n    color: #1a1a1a;\n    font-weight: normal;\n    letter-spacing: -0.01em;\n    font-family: Georgia, serif;\n  }\n  \n  .title-left h1 .accent {\n    color: #C2175B;\n    font-style: italic;\n    font-weight: normal;\n  }\n  \n  .title-right {\n    text-align: right;\n    padding-top: 8px;\n  }\n  \n  .title-right .author {\n    display: block;\n    font-size: 14px;\n    color: #1a1a1a;\n    font-weight: 600;\n    margin-bottom: 8px;\n    font-family: 'JetBrains Mono', monospace;\n  }\n  \n  .title-right .date {\n    display: block;\n    font-size: 13px;\n    color: #666;\n    margin-bottom: 6px;\n  }\n  \n  .title-right .category {\n    display: block;\n    font-size: 12px;\n    color: #C2175B;\n    text-transform: uppercase;\n    letter-spacing: 0.08em;\n    font-weight: 600;\n    font-family: 'JetBrains Mono', monospace;\n  }\n  \n  h2 {\n    margin: 28px 0 16px 0;\n    font-size: 1.35em;\n    line-height: 1.25;\n    text-wrap: balance;\n    color: #1a1a1a;\n    font-weight: normal;\n    letter-spacing: -0.005em;\n  }\n  \n  h3 {\n    margin: 0 0 12px 0;\n    font-size: 1.1em;\n    color: #C2175B;\n    font-weight: 600;\n    font-family: 'JetBrains Mono', monospace;\n    text-transform: uppercase;\n  }\n  \n  /* Abstract: una colonna, riquadrata */\n  .abstract {\n    background: #f5f5f5;\n    padding: 20px 24px;\n    margin: 32px 0;\n    border-left: 3px solid #C2175B;\n    font-size: 14px;\n    line-height: 1.6;\n    font-style: italic;\n    color: #404040;\n  }\n  \n  .abstract-title {\n    font-weight: 600;\n    font-style: normal;\n    color: #1a1a1a;\n    display: block;\n    margin-bottom: 8px;\n    font-size: 13px;\n    text-transform: uppercase;\n    letter-spacing: 0.08em;\n    color: #C2175B;\n    font-family: 'JetBrains Mono', monospace;\n  }\n  \n  /* Two-column layout */\n  .two-col {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 28px;\n    margin-top: 32px;\n  }\n  \n  .col {\n    text-wrap: pretty;\n    text-align: justify;\n  }\n  \n  /* Step headers */\n  .step-title {\n    font-weight: 600;\n    color: #C2175B;\n    font-size: 1em;\n    margin: 24px 0 12px 0;\n    display: flex;\n    align-items: baseline;\n    gap: 8px;\n    font-family: 'JetBrains Mono', monospace;\n  }\n  \n  .step-num {\n    display: inline-block;\n    font-weight: 600;\n    color: #C2175B;\n    min-width: 24px;\n    font-family: 'JetBrains Mono', monospace;\n  }\n  \n  .step-content {\n    margin-bottom: 16px;\n    line-height: 1.65;\n  }\n  \n  /* Emphasis and highlights */\n  .highlight {\n    color: #C2175B;\n    font-weight: 600;\n  }\n  \n  .key-concept {\n    color: #1a1a1a;\n    font-weight: 600;\n    font-style: italic;\n  }\n  \n  /* Example function box */\n  .example-box {\n    background: #f9f7f4;\n    border-left: 2px solid #C2175B;\n    padding: 16px 20px;\n    margin: 20px 0;\n    font-size: 14px;\n    line-height: 1.6;\n  }\n  \n  .example-title {\n    font-weight: 600;\n    color: #C2175B;\n    font-size: 0.95em;\n    margin-bottom: 8px;\n    text-transform: uppercase;\n    letter-spacing: 0.05em;\n    font-family: 'JetBrains Mono', monospace;\n  }\n  \n  /* Objective callout */\n  .objective {\n    background: #f9f7f4;\n    border-left: 3px solid #C2175B;\n    padding: 18px 22px;\n    margin: 24px 0;\n    font-size: 14px;\n    line-height: 1.65;\n    color: #1a1a1a;\n  }\n  \n  .objective-label {\n    display: block;\n    font-weight: 600;\n    color: #C2175B;\n    font-size: 12px;\n    text-transform: uppercase;\n    letter-spacing: 0.08em;\n    margin-bottom: 6px;\n    font-family: 'JetBrains Mono', monospace;\n  }\n  \n  .katex-display {\n    text-align: center;\n    margin: 16px 0;\n  }\n  \n  p {\n    text-wrap: pretty;\n  }\n  \n  @media print {\n    html, body { margin: 0; padding: 0; }\n    .doc { max-width: none !important; margin: 0 !important; padding: 0.75in !important; }\n    h1, h2, h3, h4, h5, h6 { break-after: avoid; }\n    figure, pre, blockquote, img, svg { break-inside: avoid; }\n    p, li { orphans: 3; widows: 3; }\n    .two-col { break-inside: avoid; }\n  }\n<\u002Fstyle>\n\n<script src=\"c052fbf8-dd19-43d3-999e-b2c8fcb0de85\"><\u002Fscript>\n<script src=\"898004aa-50f0-402a-a58b-ce924be9693d\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n\n<main class=\"doc\">\n\n  <div class=\"title-section\">\n    <div class=\"title-left\">\n      <h1>Studio di una <span class=\"accent\">Funzione<\u002Fspan> Reale di <span class=\"accent\">Variabile<\u002Fspan> Reale<\u002Fh1>\n    <\u002Fdiv>\n    <div class=\"title-right\">\n      <span class=\"author\">Diego Falcinelli<\u002Fspan>\n      <span class=\"date\">Giugno 2026<\u002Fspan>\n      <span class=\"category\">Divulgazione Matematica<\u002Fspan>\n      <p style=\"margin: 32px 0 0 0; padding-top: 24px; border-top: 1px solid #e0e0e0; font-size: 14px; font-style: italic; color: #666; text-align: right; line-height: 1.6;\"><span style=\"display: block; margin-bottom: 6px;\">«La matematica è il linguaggio con cui Dio ha scritto l'universo.»<\u002Fspan> <span style=\"white-space: nowrap;\">— Galileo Galilei<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"objective\">\n    <span class=\"objective-label\">L'obiettivo<\u002Fspan>\n    <p style=\"margin: 0;\">Data un'equazione: $y = f(x)$ vogliamo <span class=\"highlight\">visualizzare il grafico della funzione<\u002Fspan>. Non è magia: è un metodo sistematico e preciso che ci permette di passare da una formula astratta a una <span class=\"key-concept\">immagine mentale concreta<\u002Fspan> di come la funzione si comporta.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"abstract\">\n    <span class=\"abstract-title\">Abstract<\u002Fspan>\n    <p style=\"margin: 0;\">Lo studio di funzione è uno dei pilastri dell'analisi matematica. In questo articolo esaminiamo la metodologia completa, passo passo, per affrontare lo studio di una funzione razionale reale di variabile reale, dalla sua classificazione fino al calcolo della derivata seconda. Scopriremo come ogni passaggio costruisce informazioni essenziali per disegnare il grafico, e come l'apparente rigore matematico cela un'elegante semplicità.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"two-col\">\n    <div class=\"col\">\n      \n      <h2 style=\"margin-top: 0;\">Metodologia Sistematica<\u002Fh2>\n\n      <div class=\"step-title\">\n        <span class=\"step-num\">1.<\u002Fspan>\n        <span>Classificazione della Funzione<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"step-content\">\n        Prima di iniziare, dobbiamo capire <span class=\"highlight\">che tipo di funzione<\u002Fspan> stiamo affrontando. È una funzione <span class=\"key-concept\">razionale intera<\u002Fspan> (polinomio) o <span class=\"key-concept\">razionale fratta<\u002Fspan> (rapporto di polinomi)? Irrazionale, trigonometrica, logaritmica, esponenziale? La classificazione ci dice già molto sul comportamento della funzione — ad esempio, una razionale fratta avrà asintoti verticali, mentre una funzione esponenziale avrà asintoti orizzontali.\n        \n        Ogni categoria ha proprietà caratteristiche: i polinomi sono funzioni continue ovunque senza discontinuità, le funzioni razionali fratte presentano punti di discontinuità, le funzioni irrazionali hanno vincoli sul loro dominio, e le funzioni trigonometriche sono periodiche. Riconoscere la famiglia di appartenenza della nostra funzione è il primo passo per orientarsi verso la soluzione del problema.\n        \n        <div class=\"example-box\">\n          <span class=\"example-title\">Esempio 1: Razionale intera<\u002Fspan>\n          <p style=\"margin: 0;\">$$f(x) = x^3 - 3x^2 + 2$$<\u002Fp>\n          <p style=\"margin: 8px 0 0 0; font-size: 13px;\">Un polinomio di grado 3. Dominio: tutti i reali. Niente asintoti.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"example-box\">\n          <span class=\"example-title\">Esempio 2: Razionale fratta<\u002Fspan>\n          <p style=\"margin: 0;\">$$g(x) = \\frac{x + 1}{x^2 - 1}$$<\u002Fp>\n          <p style=\"margin: 8px 0 0 0; font-size: 13px;\">Rapporto di polinomi. Qui c'è da stare attenti: $x^2 - 1 = 0$ quando $x = \\pm 1$.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"step-title\">\n        <span class=\"step-num\">2.<\u002Fspan>\n        <span>Dominio (Campo di Esistenza)<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"step-content\">\n        Il dominio è l'insieme di tutti gli <span class=\"highlight\">x per cui la funzione è definita<\u002Fspan>. Per una razionale intera, è tutto ℝ. Per una razionale fratta, escludiamo i valori che annullano il denominatore. Per funzioni irrazionali, il dominio è vincolato dalle condizioni di esistenza della radice (ad esempio, una radice pari richiede argomento non negativo).\n        \n        La determinazione del dominio è cruciale perché esclude a priori le zone del piano dove la funzione non esiste. Una discontinuità nel dominio (come un \"buco\" in una retta numerica) diventerà una caratteristica visibile del grafico: una linea verticale che il grafico non può attraversare.\n        <p style=\"margin: 12px 0 0 0;\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-weight: 600; font-style: normal; color: #1a1a1a;\">Esempio 1:<\u002Fspan> $D = \\mathbb{R}$ (tutti i numeri reali)<br>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-weight: 600; font-style: normal; color: #1a1a1a;\">Esempio 2:<\u002Fspan> $D = \\mathbb{R} \\setminus \\{-1, 1\\}$ (escludiamo le discontinuità)\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"step-title\">\n        <span class=\"step-num\">3.<\u002Fspan>\n        <span>Simmetrie e Parità<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"step-content\">\n        Controlliamo se $f(-x) = f(x)$ (funzione <span class=\"key-concept\">pari<\u002Fspan>, simmetrica rispetto all'asse y) oppure $f(-x) = -f(x)$ (funzione <span class=\"key-concept\">dispari<\u002Fspan>, simmetrica rispetto all'origine). Se è pari o dispari, studiamo solo una \"metà\" del grafico e riflettiamo il risultato.\n        \n        Le funzioni pari hanno la forma tipica di una parabola — specchiata perfettamente sull'asse verticale. Le funzioni dispari, come il grafico di una funzione cubica, hanno una simmetria rotazionale di 180° intorno all'origine. Riconoscere queste simmetrie non è solo un esercizio teorico: riduce drasticamente il lavoro computazionale necessario per tracciare il grafico completo.\n        <p style=\"margin: 12px 0 0 0;\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-weight: 600; font-style: normal; color: #1a1a1a;\">Esempio 1:<\u002Fspan> $f(-x) = (-x)^3 - 3(-x)^2 + 2 = -x^3 - 3x^2 + 2 \\neq \\pm f(x)$ → né pari né dispari<br>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-weight: 600; font-style: normal; color: #1a1a1a;\">Esempio 2:<\u002Fspan> Non è né pari né dispari.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"step-title\">\n        <span class=\"step-num\">4.<\u002Fspan>\n        <span>Intersezioni con gli Assi<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"step-content\">\n        Dove il grafico <span class=\"highlight\">taglia gli assi<\u002Fspan>? Poniamo $f(x) = 0$ per gli zeri (intersezioni con l'asse x), e calcoliamo $f(0)$ per l'intersezione con l'asse y. Gli zeri della funzione sono punti critici dal punto di vista grafico: sono i punti dove il grafico \"attraversa\" l'asse orizzontale.\n        \n        Trovare gli zeri può essere semplice (per funzioni lineari o quadratiche) o molto complesso (per polinomi di grado superiore). Non sempre avremo una formula chiusa: a volte dovremo approssimare gli zeri numericamente. L'intersezione con l'asse y è invece sempre facile da calcolare e ci dà un punto certo da cui possiamo iniziare a tracciare il grafico.\n        <p style=\"margin: 12px 0 0 0;\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-weight: 600; font-style: normal; color: #1a1a1a;\">Esempio 1:<\u002Fspan> Zeri: risolvi $x^3 - 3x^2 + 2 = 0$. Asse y: $f(0) = 2$<br>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-weight: 600; font-style: normal; color: #1a1a1a;\">Esempio 2:<\u002Fspan> Zeri: $x + 1 = 0 \\Rightarrow x = -1$, ma è fuori dal dominio! Asse y: $g(0) = -1$\n        <\u002Fp>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <div class=\"col\">\n      \n      <div class=\"step-title\" style=\"margin-top: 0;\">\n        <span class=\"step-num\">5.<\u002Fspan>\n        <span>Asintoti<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"step-content\">\n        Gli asintoti sono le \"linee fantasma\" che la funzione <span class=\"highlight\">cerca di raggiungere all'infinito<\u002Fspan>. Possono essere orizzontali, verticali, oppure obliqui, e rappresentano il comportamento asintotico della funzione.\n        \n        Un asintoto verticale è una barriera invisibile che il grafico non può attraversare — la funzione tende a $+\\infty$ oppure $-\\infty$ mentre si avvicina a questa linea. Gli asintoti orizzontali e obliqui, invece, descrivono come il grafico si comporta quando $x$ tende all'infinito: la curva si avvicina sempre più a quella linea retta senza però raggiungerla mai (se non in casi eccezionali).\n        <p style=\"margin: 12px 0 8px 0;\">\n          <span class=\"key-concept\">Asintoti verticali:<\u002Fspan> dove il denominatore si annulla (per razionali fratte)<br>\n          <span class=\"key-concept\">Asintoti orizzontali:<\u002Fspan> confronta i gradi dei polinomi numeratore/denominatore<br>\n          <span class=\"key-concept\">Asintoti obliqui:<\u002Fspan> quando il numeratore ha grado uno in più del denominatore\n        <\u002Fp>\n        <div class=\"example-box\">\n          <span class=\"example-title\">Esempio 2 approfondito<\u002Fspan>\n          <p style=\"margin: 0;\">Asintoto verticale: $x = -1$ e $x = 1$. Asintoto orizzontale: numeratore ha grado 1, denominatore grado 2, quindi $y = 0$.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"step-title\">\n        <span class=\"step-num\">6.<\u002Fspan>\n        <span>Limiti agli Estremi<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"step-content\">\n        Calcoliamo:\n        $$\\lim_{\\substack{x \\to +\\infty}} f(x) \\quad \\text{e} \\quad \\lim_{\\substack{x \\to -\\infty}} f(x)$$\n        Questo ci dice il <span class=\"highlight\">comportamento della funzione all'infinito<\u002Fspan>. I limiti alle estremità del dominio sono fondamentali per capire come il grafico si estende verso i bordi del piano cartesiano. Per le funzioni razionali, il comportamento asintotico dipende dai gradi dei polinomi: se il numeratore e il denominatore hanno lo stesso grado, il limite è il rapporto dei coefficienti di grado massimo; se il numeratore ha grado maggiore, il limite è infinito.\n        \n        Questi calcoli non sono un'astrazione sterile — sono l'informazione che ci dice: \"il grafico in alto a destra salirà verso l'infinito\" oppure \"scenderà verso l'asse x\". Senza questa informazione, il nostro disegno sarebbe incompleto e fuorviante.\n        <p style=\"margin: 12px 0 0 0;\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-weight: 600; font-style: normal; color: #1a1a1a;\">Esempio 1:<\u002Fspan> Polinomio di grado dispari → limiti opposti (+∞ e −∞)<br>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-weight: 600; font-style: normal; color: #1a1a1a;\">Esempio 2:<\u002Fspan> Grado numeratore &lt; grado denominatore → entrambi i limiti tendono a 0\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"step-title\">\n        <span class=\"step-num\">7.<\u002Fspan>\n        <span>Derivata Prima e Monotonia<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"step-content\">\n        Calcoliamo <span class=\"key-concept\">$f'(x)$<\u002Fspan> e studiamo il suo <span class=\"highlight\">segno<\u002Fspan>. Dove $f'(x) &gt; 0$, la funzione è crescente; dove $f'(x) &lt; 0$, è decrescente. Dove $f'(x) = 0$, abbiamo punti critici — potenziali massimi e minimi.\n        \n        La derivata prima è la velocità istantanea di cambio della funzione: quando è positiva, il grafico sale; quando è negativa, scende. Studiare il segno della derivata significa creare una <span class=\"key-concept\">tabella di variazione<\u002Fspan>, uno strumento estremamente utile che sintetizza in una riga tutto ciò che sappiamo sulla monotonia della funzione. Questo è il punto in cui il grafico inizia veramente a prendere forma: sappiamo dove \"sale\" e dove \"scende\", e possiamo già immaginare la struttura complessiva della curva.\n      <\u002Fdiv>\n\n      <div class=\"step-title\">\n        <span class=\"step-num\">8.<\u002Fspan>\n        <span>Massimi e Minimi Locali<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"step-content\">\n        Nei punti dove $f'(x) = 0$, applichiamo il <span class=\"key-concept\">test della derivata prima<\u002Fspan> oppure della <span class=\"key-concept\">derivata seconda<\u002Fspan> per capire se è un massimo, un minimo, o un punto di flesso a tangente orizzontale.\n        \n        Il test della derivata prima è semplice: se la derivata cambia da positiva a negativa, abbiamo un massimo locale; se cambia da negativa a positiva, abbiamo un minimo locale; se non cambia segno, il punto è un flesso. Il test della derivata seconda, invece, usa la concavità: se $f''(x) &gt; 0$ nel punto critico, è un minimo; se $f''(x) &lt; 0$, è un massimo. Questi punti sono visivamente importantissimi: sono le \"cime\" e le \"valli\" del grafico, i punti dove la curva cambia direzione in modo drammatico.\n      <\u002Fdiv>\n\n      <div class=\"step-title\">\n        <span class=\"step-num\">9.<\u002Fspan>\n        <span>Derivata Seconda e Concavità<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"step-content\">\n        Calcoliamo <span class=\"key-concept\">$f''(x)$<\u002Fspan>. Dove $f''(x) &gt; 0$, il grafico è <span class=\"highlight\">concavo verso l'alto<\u002Fspan> (∪); dove $f''(x) &lt; 0$, è <span class=\"highlight\">concavo verso il basso<\u002Fspan> (∩). I punti dove $f''(x) = 0$ sono i <span class=\"key-concept\">flessi<\u002Fspan>.\n        \n        La derivata seconda misura la \"curvatura\" del grafico: quanto rapidamente la pendenza della tangente cambia. Dove è positiva, la curva \"accelera verso l'alto\"; dove è negativa, \"accelera verso il basso\". I punti di flesso sono quelli dove questa accelerazione cambia segno — sono i punti dove la curva passa da \"gonfia\" a \"concava\" (o viceversa). La concavità è un'informazione visiva potentissima: ci permette di disegnare il grafico con una precisione che va ben oltre i soli punti critici, dando al nostro disegno un'eleganza e una fedeltà matematica che altrimenti mancherebbe.\n      <\u002Fdiv>\n\n      <div class=\"step-title\">\n        <span class=\"step-num\">10.<\u002Fspan>\n        <span>Sintesi e Grafico<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"step-content\">\n        Mettiamo tutto insieme. Abbiamo dominio, zeri, asintoti, monotonia, estremi locali, concavità e flessi. <span class=\"highlight\">Ora possiamo disegnare il grafico con sicurezza.<\u002Fspan>\n        \n        Il grafico finale non è una fotografia casuale, ma una mappa fedele e completa di come la funzione si comporta. Ogni informazione che abbiamo raccolto nei dieci step precedenti trova il suo posto nel disegno: il dominio stabilisce dove possiamo disegnare, gli asintoti forniscono i \"binari\" invisibili che la curva segue all'infinito, i punti critici sono i vertici della curva, e la concavità ci dice esattamente come collegare questi punti.\n        \n        Questo metodo sistematico trasforma lo studio di una funzione da un'operazione nebulosa e casuale a un processo logico e prevedibile. Non è magia, non è intuizione — è matematica pura che parla il linguaggio universale dei grafici. E una volta che avete imparato questo linguaggio, potete leggere il comportamento di qualsiasi funzione, non importa quanto complicata possa sembrare all'inizio.\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin-top: 40px; padding-top: 24px; border-top: 1px solid #e0e0e0; color: #666; font-size: 13px;\">\n    <em>Lo studio di funzione è una danza tra rigore e intuizione: il metodo è preciso, ma l'obiettivo è sempre lo stesso — vedere ciò che l'equazione racconta.<\u002Fem>\n  <\u002Fp>\n\n  <!-- Seconda sezione: ECG -->\n  <div style=\"margin-top: 60px; padding-top: 40px; border-top: 2px solid #C2175B;\">\n    <h1 style=\"margin: 0 0 24px 0; font-size: 2.4em; line-height: 1.3; text-wrap: balance; color: #C2175B; font-weight: normal; letter-spacing: -0.01em; font-family: Georgia, serif;\">\n      Funzioni <span style=\"font-style: italic; color: #C2175B;\">reali<\u002Fspan> — Può essere <span style=\"font-style: italic; color: #C2175B;\">questione<\u002Fspan> <span style=\"font-style: italic; color: #C2175B;\">di<\u002Fspan> vita o <span style=\"font-style: italic; color: #C2175B;\">di<\u002Fspan> morte\n    <\u002Fh1>\n\n    <div style=\"background: #f5f5f5; padding: 20px 24px; margin: 32px 0; border-left: 3px solid #C2175B; font-size: 14px; line-height: 1.6; color: #404040;\">\n      <p style=\"margin: 0; text-align: left; font-style: italic;\">L'elettrocardiogramma è una straordinaria applicazione pratica dello studio di funzione. Ogni battito cardiaco genera un segnale elettrico che, quando rappresentato graficamente nel tempo, rivela lo stato di salute del cuore. Questo grafico non è casuale: segue leggi matematiche precise, e imparare a leggerlo significa letteralmente saper interpretare la vita stessa.<\u002Fp>\n    <\u002Fdiv>\n\n    <h2 style=\"margin: 32px 0 16px 0; font-size: 1.3em; line-height: 1.25; text-wrap: balance; color: #1a1a1a; font-weight: normal; letter-spacing: -0.005em;\">L'Equazione dell'Attività Cardiaca<\u002Fh2>\n\n    <p style=\"margin: 16px 0; text-align: left; padding: 24px; background: #f9f7f4; border-radius: 4px; font-size: 15px; line-height: 1.65;\">\n      Una semplificazione dell'attività cardiaca può essere rappresentata come una combinazione di funzioni sinusoidali:\n    <\u002Fp>\n\n    <div style=\"background: #f9f7f4; padding: 24px; margin: 24px 0; border-left: 3px solid #C2175B; font-size: 15px; text-align: center;\">\n      $$V(t) = A \\sin(\\omega t + \\phi) + B e^{-\\lambda t} \\sin(\\omega_2 t)$$\n      \n      <p style=\"margin: 16px 0 0 0; font-size: 13px; color: #666; text-align: left;\">\n        Dove:<br>\n        • $V(t)$ = voltaggio registrato nel tempo<br>\n        • $A$ = ampiezza dell'onda principale<br>\n        • $\\omega$ = frequenza cardiaca angolare (legata ai battiti per minuto)<br>\n        • $\\phi$ = fase iniziale<br>\n        • $B$ e $\\lambda$ = parametri di attenuazione delle oscillazioni<br>\n        • $\\omega_2$ = frequenza secondaria delle onde minori\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <p style=\"margin: 24px 0; font-size: 14px; line-height: 1.65; text-align: left;\">\n      Questa equazione, per quanto semplificata, cattura l'essenza matematica di un ECG: una sovrapposizione di oscillazioni smorzate che variano nel tempo. Applicando il metodo dello studio di funzione a questa equazione — analizzando il dominio, gli zeri, gli estremi, la concavità — possiamo identificare anomalie nel segnale che potrebbero indicare aritmie, infarto, o altre patologie cardiache. Ciò che il cardiologo vede come una \"forma strana\" nel grafico, il matematico vede come una violazione delle proprietà attese della funzione.\n    <\u002Fp>\n\n    <h2 style=\"margin: 32px 0 16px 0; font-size: 1.3em; line-height: 1.25; text-wrap: balance; color: #1a1a1a; font-weight: normal; letter-spacing: -0.005em;\">Il Grafico dell'Elettrocardiogramma<\u002Fh2>\n\n    <div style=\"margin: 24px 0; padding: 20px; background: #f5f5f5; border-radius: 4px; display: flex; justify-content: center;\">\n      <svg viewBox=\"0 0 900 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width: 100%; max-width: 900px; height: auto;\">\n        <!-- Grid -->\n        <defs>\n          <pattern id=\"grid\" width=\"20\" height=\"20\" patternUnits=\"userSpaceOnUse\">\n            <path d=\"M 20 0 L 0 0 0 20\" fill=\"none\" stroke=\"#e0e0e0\" stroke-width=\"0.5\"><\u002Fpath>\n          <\u002Fpattern>\n        <\u002Fdefs>\n        <rect width=\"900\" height=\"250\" fill=\"#fafafa\"><\u002Frect>\n        <rect width=\"900\" height=\"250\" fill=\"url(#grid)\" opacity=\"0.5\"><\u002Frect>\n        \n        <!-- Baseline -->\n        <line x1=\"0\" y1=\"125\" x2=\"900\" y2=\"125\" stroke=\"#1a1a1a\" stroke-width=\"1.5\"><\u002Fline>\n        \n        <!-- P wave -->\n        <path d=\"M 60,125 Q 80,105 100,125\" stroke=\"#C2175B\" stroke-width=\"2\" fill=\"none\"><\u002Fpath>\n        \n        <!-- PR interval -->\n        <line x1=\"100\" y1=\"125\" x2=\"150\" y2=\"125\" stroke=\"#1a1a1a\" stroke-width=\"1\"><\u002Fline>\n        \n        <!-- QRS complex -->\n        <path d=\"M 150,125 L 170,115 L 180,70 L 190,130 L 210,125\" stroke=\"#1a1a1a\" stroke-width=\"2.5\" fill=\"none\"><\u002Fpath>\n        \n        <!-- ST segment -->\n        <line x1=\"210\" y1=\"125\" x2=\"250\" y2=\"125\" stroke=\"#1a1a1a\" stroke-width=\"1\"><\u002Fline>\n        \n        <!-- T wave -->\n        <path d=\"M 250,125 Q 280,95 310,125\" stroke=\"#C2175B\" stroke-width=\"2\" fill=\"none\"><\u002Fpath>\n        \n        <!-- Second beat P -->\n        <path d=\"M 400,125 Q 420,105 440,125\" stroke=\"#C2175B\" stroke-width=\"2\" fill=\"none\"><\u002Fpath>\n        \n        <!-- Second PR -->\n        <line x1=\"440\" y1=\"125\" x2=\"490\" y2=\"125\" stroke=\"#1a1a1a\" stroke-width=\"1\"><\u002Fline>\n        \n        <!-- Second QRS -->\n        <path d=\"M 490,125 L 510,115 L 520,70 L 530,130 L 550,125\" stroke=\"#1a1a1a\" stroke-width=\"2.5\" fill=\"none\"><\u002Fpath>\n        \n        <!-- Second ST -->\n        <line x1=\"550\" y1=\"125\" x2=\"590\" y2=\"125\" stroke=\"#1a1a1a\" stroke-width=\"1\"><\u002Fline>\n        \n        <!-- Second T -->\n        <path d=\"M 590,125 Q 620,95 650,125\" stroke=\"#C2175B\" stroke-width=\"2\" fill=\"none\"><\u002Fpath>\n        \n        <!-- Labels -->\n        <text x=\"80\" y=\"145\" font-size=\"12\" fill=\"#C2175B\" font-family=\"Georgia, serif\" text-anchor=\"middle\">P<\u002Ftext>\n        <text x=\"180\" y=\"50\" font-size=\"12\" fill=\"#1a1a1a\" font-family=\"Georgia, serif\" text-anchor=\"middle\">R<\u002Ftext>\n        <text x=\"160\" y=\"145\" font-size=\"12\" fill=\"#1a1a1a\" font-family=\"Georgia, serif\" text-anchor=\"middle\">Q<\u002Ftext>\n        <text x=\"200\" y=\"145\" font-size=\"12\" fill=\"#1a1a1a\" font-family=\"Georgia, serif\" text-anchor=\"middle\">S<\u002Ftext>\n        <text x=\"280\" y=\"80\" font-size=\"12\" fill=\"#C2175B\" font-family=\"Georgia, serif\" text-anchor=\"middle\">T<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <p style=\"margin: 12px 0 0 0; text-align: center; font-size: 13px; color: #666; font-style: italic;\">Figura 1: Rappresentazione standard di un elettrocardiogramma (ECG) con le onde caratteristiche P, QRS e T, gli intervalli PR e le fasi di un battito cardiaco.<\u002Fp>\n\n    <div class=\"two-col\" style=\"margin-top: 32px;\">\n      <div class=\"col\">\n        <h3>Le onde del battito cardiaco<\u002Fh3>\n        \n        <p style=\"margin: 0 0 16px 0; text-align: justify;\">\n          L'ECG mostra chiaramente le tre fasi principali della contrazione cardiaca, ognuna caratterizzata da un'onda specifica. L'<span class=\"key-concept\">onda P<\u002Fspan> rappresenta la depolarizzazione degli atri — il momento in cui gli atri si contraggono per spingere il sangue nei ventricoli. È una piccola ondulazione, quasi delicata, che anticipa gli eventi più drammatici a venire.\n        <\u002Fp>\n\n        <p style=\"margin: 0 0 16px 0; text-align: justify;\">\n          Il <span class=\"key-concept\">complesso QRS<\u002Fspan> è il momento critico: rappresenta la depolarizzazione dei ventricoli, la contrazione più potente del cuore. È caratterizzato da tre componenti — l'onda Q (negativa), l'onda R (positiva e più grande), e l'onda S (negativa di nuovo). Questo complesso è visivamente dominante perché è qui che il muscolo cardiaco esercita la sua massima forza. Qualunque anomalia in questa sezione segnala un grave problema: un infarto, un'aritmia, un'ipertrofia ventricolare.\n        <\u002Fp>\n\n        <p style=\"text-align: justify;\">\n          L'<span class=\"key-concept\">onda T<\u002Fspan> rappresenta la ripolarizzazione ventricolare — il ritorno dei ventricoli al loro stato di riposo. È come l'espirazione dopo un'inspirazione profonda: il cuore si rilassa, preparandosi per il prossimo battito. La forma e l'ampiezza di questa onda forniscono informazioni cruciali sullo stato metabolico e sulla salute generale del muscolo cardiaco.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"col\">\n        <h3>Lo studio di funzione nell'ECG<\u002Fh3>\n        \n        <p style=\"margin: 0 0 16px 0; text-align: justify;\">\n          Applicare il nostro metodo sistematico a un ECG significa riconoscere che il grafico del segnale cardiaco non è una collezione casuale di picchi e valli, ma il risultato di funzioni matematiche ben definite. Il <span class=\"highlight\">dominio<\u002Fspan> è il tempo della registrazione; gli <span class=\"highlight\">zeri<\u002Fspan> sono i momenti in cui il voltaggio torna alla linea di base; i <span class=\"highlight\">massimi e minimi<\u002Fspan> sono le cime e le valli delle onde.\n        <\u002Fp>\n\n        <p style=\"margin: 0 0 16px 0; text-align: justify;\">\n          Gli <span class=\"highlight\">asintoti<\u002Fspan>, in questo contesto, non sono presenti — il segnale deve sempre tornare alla linea di base tra i battiti. La <span class=\"highlight\">concavità<\u002Fspan> del segnale — come il grafico \"curva\" — rivela il ritmo con cui gli atomi di potassio e sodio si muovono attraverso le membrane cellulari del cuore. Una curva troppo ripida indica una velocità anomala di conduzione; una curva appiattita suggerisce un'ostruzione o una malformazione.\n        <\u002Fp>\n\n        <p style=\"margin: 0 0 16px 0; text-align: justify;\">\n          Quando un cardiologo guarda un ECG e dice \"questo non è normale\", sta facendo — consapevolmente o meno — uno studio di funzione. Riconosce che la forma, l'ampiezza, la durata di ogni onda, il loro ordine e il loro comportamento nel tempo devono seguire pattern attesi. Una deviazione da questi pattern è il segnale visibile di qualcosa che non funziona matematicamente — e quindi fisiologicamente — nel cuore del paziente.\n        <\u002Fp>\n\n        <p style=\"text-align: justify;\">\n          In questo senso, la capacità di leggere un ECG non è una magia medica, ma l'applicazione pratica e letteralmente salvavita dello studio di funzione. Ogni medico che legge un ECG è, in realtà, un matematico che interpreta il grafico più importante che esista: quello della vita stessa.\n        <\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fmain>\n\n<script>\n  document.addEventListener('DOMContentLoaded', function() {\n    if (window.renderMathInElement) {\n      renderMathInElement(document.body, {\n        delimiters: [\n          {left: '$$', right: '$$', display: true},\n          {left: '$', right: '$', display: false}\n        ]\n      });\n    }\n  });\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
