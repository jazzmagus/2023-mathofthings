<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lezione — Introduzione al calcolo integrale</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<script>
MathJax = {
  tex: {
    inlineMath: [['\\(','\\)']],
    displayMath: [['\\[','\\]']],
  },
  svg: {
    fontCache: 'global',
    scale: 1.05
  },
  startup: {
    ready: () => {
      MathJax.startup.defaultReady();
      MathJax.startup.promise.then(() => {
        document.body.style.opacity = '1';
      });
    }
  }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>
<style>
:root {
  --bg: #faf7f2;
  --surface: #ffffff;
  --surface-alt: #f5f0e8;
  --border: #e4ddd4;
  --border-light: #ece7de;
  --text: #2c2520;
  --text-mid: #5a524a;
  --text-dim: #6e6760;
  --accent: #2e6da4;
  --accent-light: #e3edf7;
  --blue: #3a6b8c;
  --blue-light: #e8f0f5;
  --green: #4a7c59;
  --green-light: #eaf5ed;
  --purple: #6a1b9a;
  --purple-light: #f3e5f5;
  --gold: #b8860b;
  --gold-light: #fdf8ed;
  --teal: #4f6d7a;
  --teal-light: #e8eff2;
  --danger: #b33a3a;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(44,37,32,.04);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family:'Georgia',serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.75;
  font-size:17px;
  opacity:0;
  transition: opacity .3s;
}

/* ── TOPBAR ── */
.topbar {
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:rgba(250,247,242,.96);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border-light);
  height:52px; display:flex; align-items:center;
  padding:0 clamp(16px,4vw,40px); gap:16px;
}
.topbar-brand {
  font-family:'Playfair Display',serif;
  font-size:1.05rem; font-weight:700;
  color:var(--text); white-space:nowrap;
}
.topbar-nav {
  display:flex; gap:3px; overflow-x:auto;
  scrollbar-width:none; flex:1;
}
.topbar-nav::-webkit-scrollbar{display:none}
.nav-pill {
  background:none; border:none;
  font-family:'JetBrains Mono',monospace;
  font-size:.82rem; color:var(--text-dim);
  padding:6px 14px; border-radius:0;
  cursor:pointer; white-space:nowrap; transition:all .2s;
  border-bottom:2px solid transparent;
}
.nav-pill:hover{background:none;color:var(--text)}
.nav-pill.active{background:none;color:var(--accent);font-weight:600;border-bottom:2px solid var(--accent)}
.topbar-home {
  font-family:'JetBrains Mono',monospace;
  font-size:0.75rem; color:var(--text-dim);
  text-decoration:none; cursor:pointer;
  white-space:nowrap;
}
.topbar-home:hover{color:var(--accent)}

/* ── CONTAINER ── */
.container{max-width:780px;margin:0 auto;padding:84px clamp(20px,5vw,48px) 60px}

/* ── SECTIONS ── */
.section{display:none;animation:appear .4s ease}
.section.active{display:block}
@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ── HERO ── */
.hero{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border-light)}
.hero-tag{font-family:'Fira Code',monospace;font-size:.73rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(1.9rem,5vw,2.7rem);font-weight:800;line-height:1.15;margin-bottom:12px}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero-sub{font-size:1.02rem;color:var(--text-mid);max-width:580px;line-height:1.7;text-align:justify}

/* ── CONCEPT BOXES ── */
.cb{background:var(--surface-alt);border:none;border-radius:0;padding:16px 0 16px 18px;margin:18px 0;box-shadow:none;position:relative;border-left:2px solid var(--accent)}
.cb-label{font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:600;color:var(--accent)}
.cb.tip .cb-label{color:var(--blue)} .cb.warn .cb-label{color:var(--gold)}
.cb.danger .cb-label{color:var(--danger)} .cb.success .cb-label{color:var(--green)}
.cb.method .cb-label{color:var(--accent)} .cb.purple .cb-label{color:var(--purple)}
.cb.teal .cb-label{color:var(--teal)}

/* ── MATH DISPLAY BLOCKS ── */
.math-block {
  background: rgba(0,0,0,.02);
  border: none;
  border-radius: 0;
  padding: 12px 16px;
  margin: 10px 0;
  overflow-x: auto;
}
.math-block.dark { background: rgba(0,0,0,.04); }
.math-block.hero-formula {
  background: var(--surface-alt);
  border: none;
  padding: 16px 20px;
  text-align: center;
}
.math-block.result {
  border-left: 2px solid var(--green);
  background: rgba(74,124,89,.04);
  padding: 12px 16px;
  margin: 10px 0;
}
.math-block.warning {
  border-left: 2px solid var(--danger);
  background: rgba(179,58,58,.04);
  padding: 12px 16px;
  margin: 10px 0;
}

/* ── STEP-BY-STEP ── */
.step-math { margin: 6px 0; padding: 4px 0; }
.step-math .label {
  font-family: 'Fira Code', monospace;
  font-size: .72rem; letter-spacing: 1px;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px;
}
.step-math .label.green { color: var(--green); }

/* ── ACCORDION ── */
.accordion{border:none;border-radius:0;overflow:visible;margin:16px 0;box-shadow:none}
.acc-item{border-bottom:1px solid rgba(0,0,0,.08);border-top:none}
.acc-item:last-child{border-bottom:none}
.acc-header{display:flex;align-items:center;gap:12px;padding:14px 0;background:none;cursor:pointer;transition:all .2s;user-select:none}
.acc-header:hover{background:none}
.acc-num{width:24px;height:24px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.acc-title{font-weight:600;font-size:.95rem;flex:1;color:var(--text);display:flex;justify-content:space-between;align-items:center;gap:12px}
.acc-arrow{width:16px;height:16px;color:var(--text-dim);transition:transform .3s;flex-shrink:0}
.acc-item.open .acc-arrow{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease;background:none}
.acc-item.open .acc-body{max-height:8000px}
.acc-inner{padding:8px 0 16px 36px;border-top:none}

/* ── TABLES ── */
.ct{width:100%;border-collapse:collapse;margin:14px 0;font-size:.9rem}
.ct th{text-align:left;padding:11px 14px;font-weight:600;color:var(--accent);border-bottom:1px solid var(--border-light);font-size:.78rem;letter-spacing:.5px;text-transform:uppercase;font-family:'Fira Code',monospace}
.ct td{padding:10px 14px;border-bottom:1px solid var(--border-light);vertical-align:top}
.ct tr:last-child td{border-bottom:none}

/* ── MATHJAX FORMATTING ── */
mjx-container[jax="SVG"] { text-align: center; }
mjx-munder { display: inline-block; }
mjx-munderover { display: inline-block; }

/* ── SVG ── */
.graph-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin:18px 0;box-shadow:var(--shadow);overflow-x:auto;text-align:center}
.graph-box svg text{font-family:'Georgia',serif}
.graph-cap{font-family:'Fira Code',monospace;font-size:.72rem;color:var(--text-dim);margin-top:8px}

/* ── DISC CARDS ── */
.disc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.disc-card{text-align:center;padding:20px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow)}
.disc-card h4{font-family:'Fira Code',monospace;font-size:.9rem;margin-bottom:10px}
.disc-card p{font-size:.85rem;color:var(--text-mid)}

/* ── BOTTOM NAV ── */
.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:52px;padding-top:26px;border-top:1px solid var(--border-light)}
.bb{font-family:'JetBrains Mono',monospace;font-size:.85rem;padding:0;border:none;background:none;color:var(--text);transition:all .2s;cursor:pointer;text-decoration:none}
.bb:hover{color:var(--accent);text-decoration:underline}
.bb:disabled{opacity:.35;cursor:not-allowed;text-decoration:none}
.bb:disabled:hover{color:var(--text);text-decoration:none}
.bb.primary{background:none;color:var(--text);border:none;font-weight:400}
.bb.primary:hover{color:var(--accent);text-decoration:underline;background:none}
.page-info{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--text-dim)}

p{margin:6px 0}
ul,ol{margin:8px 0 8px 20px}
li{margin:2px 0}
.dim{color:var(--text-dim)}
strong{font-weight:600}
h2{margin:24px 0 12px}
h3{margin:16px 0 8px}

/* ── CHECKLIST ── */
.checklist{list-style:none;margin:12px 0}
.checklist li{position:relative;padding:6px 0 6px 32px;font-size:.95rem;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:all .2s}
.checklist li::before{content:'☐';position:absolute;left:6px;top:6px;font-size:1rem;color:var(--accent);transition:all .2s}
.checklist li.checked{color:var(--text-dim);text-decoration:line-through}
.checklist li.checked::before{content:'☑'}

/* ── MathJax overrides ── */
mjx-container[jax="SVG"] { direction: ltr; }
mjx-container { overflow-x: auto; overflow-y: hidden; max-width: 100%; }

@media(max-width:640px){
  body{font-size:16px}
  .hero h1{font-size:1.7rem}
  .acc-header{padding:13px 14px}
  .acc-inner{padding:4px 14px 18px}
  .cb{padding:18px}
  .disc-row{grid-template-columns:1fr}
  .math-block{padding:14px 16px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">Introduzione al calcolo integrale</div>
  <div class="topbar-nav" id="topNav"></div>
  <a href="/" class="topbar-home">← home</a>
</div>
<div class="container" id="app"></div>

<script>
// ══════════════════════════
// Accordion builder
// ══════════════════════════
function acc(items) {
  return '<div class="accordion">'+items.map((it,i)=>`
    <div class="acc-item">
      <div class="acc-header" onclick="toggleAcc(this)">
        <div class="acc-num">${i+1}</div>
        <div class="acc-title">${it.t}</div>
        <svg class="acc-arrow" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div class="acc-body"><div class="acc-inner">${it.h}</div></div>
    </div>`).join('')+'</div>';
}

function toggleAcc(el) {
  const item = el.parentElement;
  const wasOpen = item.classList.contains('open');
  item.classList.toggle('open');
  if (!wasOpen && typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([item]);
  }
}

// ══════════════════════════
// SVG helpers
// ══════════════════════════
const AXC = '#cfc7bb', TXT = '#8a827a';

function axes(ox, oy, w, topY) {
  return `
    <line x1="${ox}" y1="${topY}" x2="${ox}" y2="${oy+14}" stroke="${AXC}" stroke-width="1.2"/>
    <line x1="${ox-12}" y1="${oy}" x2="${w-8}" y2="${oy}" stroke="${AXC}" stroke-width="1.2"/>
    <polygon points="${ox},${topY-6} ${ox-4},${topY+4} ${ox+4},${topY+4}" fill="${AXC}"/>
    <polygon points="${w-4},${oy} ${w-14},${oy-4} ${w-14},${oy+4}" fill="${AXC}"/>
    <text x="${ox-8}" y="${topY+2}" fill="${TXT}" font-size="12" font-style="italic">y</text>
    <text x="${w-6}" y="${oy+16}" fill="${TXT}" font-size="12" font-style="italic">x</text>`;
}

// Area sotto una retta y = 0.6x + 1, da x=1 a x=5, come trapezio colorato
function svgAreaRetta() {
  const w=360, h=228, ox=44, oy=200, sx=52, sy=34, topY=16;
  const c='#2e6da4';
  const f = x => 0.6*x + 1;
  const X = x => (ox + x*sx).toFixed(1);
  const Y = y => (oy - y*sy).toFixed(1);
  const a=1, b=5;
  let pts = [];
  for (let i=0;i<=40;i++){ const x=0+(6-0)*i/40; pts.push(`${X(x)},${Y(f(x))}`); }
  const areaPts = `${X(a)},${Y(0)} ${X(a)},${Y(f(a))} ${X(b)},${Y(f(b))} ${X(b)},${Y(0)}`;
  return `<div class="graph-box"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Area sotto la retta y=0,6x+1 tra x=1 e x=5, evidenziata come trapezio colorato">
    ${axes(ox,oy,w,topY)}
    <polygon points="${areaPts}" fill="${c}" opacity="0.18" stroke="none"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="${X(a)}" y1="${oy-3}" x2="${X(a)}" y2="${oy+3}" stroke="${TXT}" stroke-width="1.2"/>
    <text x="${X(a)}" y="${oy+17}" fill="${TXT}" font-size="12" text-anchor="middle" font-style="italic">a</text>
    <line x1="${X(b)}" y1="${oy-3}" x2="${X(b)}" y2="${oy+3}" stroke="${TXT}" stroke-width="1.2"/>
    <text x="${X(b)}" y="${oy+17}" fill="${TXT}" font-size="12" text-anchor="middle" font-style="italic">b</text>
    <text x="${(+X(a)+ +X(b))/2}" y="${+Y(f((a+b)/2))-10}" fill="${c}" font-size="12" text-anchor="middle" font-weight="600">area</text>
  </svg><div class="graph-cap">l'integrale definito misura l'area colorata tra la retta e l'asse x, da a a b</div></div>`;
}

// Approssimazione con rettangoli (somma di aree) sotto una parabola semplice
function svgRettangoli() {
  const w=360, h=228, ox=40, oy=200, sx=62, sy=150, topY=16;
  const c='#2e6da4', r='#b5651d';
  const f = x => 0.9 - 0.15*x*x + 0.05;
  const X = x => (ox + x*sx).toFixed(1);
  const Y = y => (oy - y*sy).toFixed(1);
  const a=0, b=2.2, n=6;
  const dx = (b-a)/n;
  let rects = '';
  for (let i=0;i<n;i++){
    const x0 = a+i*dx, xm = x0+dx/2, y0 = f(xm);
    rects += `<rect x="${X(x0)}" y="${Y(Math.max(y0,0))}" width="${(dx*sx).toFixed(1)}" height="${Math.abs(+Y(0)-+Y(Math.max(y0,0))).toFixed(1)}" fill="${r}" opacity="0.28" stroke="${r}" stroke-width="1"/>`;
  }
  let pts = [];
  for (let i=0;i<=40;i++){ const x=a+(b-a)*i/40; pts.push(`${X(x)},${Y(f(x))}`); }
  return `<div class="graph-box"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Approssimazione dell'area sotto una curva con rettangoli sottili">
    ${axes(ox,oy,w,topY)}
    ${rects}
    <polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg><div class="graph-cap">più i rettangoli sono stretti, più la loro somma si avvicina all'area esatta sotto la curva</div></div>`;
}

// ══════════════════════════
// SEZIONI
// ══════════════════════════
const S = [

// ═══ 0: MOTIVAZIONE ═══
{
  tag:"MOTIVAZIONE",
  title:"Il problema <em>inverso</em>",
  sub:"Con le derivate abbiamo imparato a rispondere a una domanda: conoscendo una funzione, come cambia? Ora facciamo il percorso contrario: conoscendo come cambia una grandezza, possiamo risalire alla grandezza stessa? È la domanda da cui nasce il calcolo integrale.",
  nav:"Il problema inverso",
  body:`
  <p>Immagina di conoscere la <strong>velocità</strong> di un'auto, istante per istante, durante un viaggio. Sapresti dire quanta <strong>strada</strong> ha percorso in totale?</p>

  <p>È il problema opposto a quello della derivata: lì, dalla posizione ricavavamo la velocità (con un limite). Qui, dalla velocità vogliamo ricavare la posizione, cioè lo <strong>spazio percorso</strong>.</p>

  <div class="cb method">
    <div class="cb-label">L'idea chiave</div>
    <p>Se la velocità fosse <strong>costante</strong>, la risposta sarebbe facile: spazio = velocità × tempo. Il problema nasce quando la velocità <strong>cambia</strong> nel tempo, ed è descritta da una funzione, non da un numero fisso.</p>
  </div>

  <p>Questo stesso tipo di domanda — "sommare tante piccole quantità che cambiano" — porta anche a un secondo problema, apparentemente diverso ma legato allo stesso concetto: calcolare l'<strong>area</strong> sotto il grafico di una funzione, cioè la regione compresa tra la curva e l'asse delle \\(x\\).</p>

  <div class="cb tip">
    <div class="cb-label">Livello di questa lezione</div>
    <p>Qui vediamo le idee di base del calcolo integrale in modo semplice e diretto, senza il rigore di una dimostrazione universitaria: l'obiettivo è capire <strong>cosa significa</strong> integrare e saper calcolare gli integrali più semplici.</p>
  </div>`
},

// ═══ 1: LA PRIMITIVA ═══
{
  tag:"DEFINIZIONE",
  title:"La <em>primitiva</em> di una funzione",
  sub:"Il primo passo è tornare indietro rispetto alla derivata: data una funzione f(x), cerchiamo una funzione F(x) che, derivata, dia esattamente f(x). Questa F(x) si chiama primitiva.",
  nav:"Primitiva",
  body:`
  <p>Ricordiamo: se deriviamo \\(F(x) = x^2\\), otteniamo \\(F'(x) = 2x\\). Ora ribaltiamo la domanda: partendo da \\(f(x) = 2x\\), quale funzione \\(F(x)\\), derivata, dà proprio \\(2x\\)?</p>

  <div class="cb method">
    <div class="cb-label">Definizione</div>
    <p>\\(F(x)\\) si dice <strong>primitiva</strong> (o antiderivata) di \\(f(x)\\) se, per ogni \\(x\\):</p>
    <div class="math-block hero-formula">\\[ F'(x) = f(x) \\]</div>
  </div>

  <p><strong>Esempio.</strong> Una primitiva di \\(f(x) = 2x\\) è \\(F(x) = x^2\\), perché \\((x^2)' = 2x\\).</p>

  <div class="cb warn">
    <div class="cb-label">Attenzione: non è unica!</div>
    <p>Anche \\(F(x) = x^2 + 5\\) è una primitiva di \\(2x\\), perché la derivata di una costante è zero: \\((x^2+5)' = 2x\\). Lo stesso vale per \\(x^2 - 3\\), \\(x^2 + 100\\), e così via.</p>
  </div>

  <p>Per questo motivo, l'insieme <strong>di tutte</strong> le primitive di \\(f(x)\\) si scrive aggiungendo una costante generica \\(c\\), detta <strong>costante di integrazione</strong>:</p>
  <div class="math-block result">\\[ F(x) + c, \\qquad c \\in \\mathbb{R} \\]</div>
  <p class="dim" style="font-size:.85rem">Graficamente, sono tutte le funzioni ottenute traslando \\(F(x)\\) verticalmente: hanno la stessa "forma", ma partono da altezze diverse.</p>`
},

// ═══ 2: INTEGRALE INDEFINITO ═══
{
  tag:"REGOLA",
  title:"L'<em>integrale indefinito</em>",
  sub:"Cercare tutte le primitive di una funzione si chiama integrare, e il simbolo che usiamo è quello dell'integrale indefinito. Per le potenze di x esiste una regola semplice, molto simile — e opposta — a quella della derivata.",
  nav:"Integrale indefinito",
  body:`
  <p>L'operazione che associa a \\(f(x)\\) l'insieme di tutte le sue primitive si chiama <strong>integrazione</strong>, e si indica con il simbolo di integrale:</p>

  <div class="math-block hero-formula">\\[ \\int f(x)\\, dx = F(x) + c \\]</div>

  <p class="dim" style="font-size:.85rem">Si legge: "integrale di \\(f(x)\\) in \\(dx\\)". Il simbolo \\(dx\\) indica rispetto a quale variabile stiamo integrando.</p>

  <div class="cb method">
    <div class="cb-label">Regola per le potenze</div>
    <p>Per integrare una potenza di \\(x\\), si aumenta l'esponente di 1 e si divide per il nuovo esponente:</p>
    <div class="math-block hero-formula">\\[ \\int x^n\\, dx = \\frac{x^{n+1}}{n+1} + c \\qquad (n \\neq -1) \\]</div>
  </div>

  <p class="dim" style="font-size:.85rem">È l'operazione <strong>inversa</strong> della derivata di potenza: derivare abbassa l'esponente di 1 e moltiplica per l'esponente; integrare alza l'esponente di 1 e divide per il nuovo esponente.</p>

  <h3>Esempi</h3>
  <table class="ct">
    <tr><th>funzione \\(f(x)\\)</th><th>integrale \\(\\int f(x)\\,dx\\)</th></tr>
    <tr><td>\\(x\\)</td><td>\\(\\dfrac{x^2}{2} + c\\)</td></tr>
    <tr><td>\\(x^2\\)</td><td>\\(\\dfrac{x^3}{3} + c\\)</td></tr>
    <tr><td>\\(x^3\\)</td><td>\\(\\dfrac{x^4}{4} + c\\)</td></tr>
    <tr><td>\\(1\\) (costante)</td><td>\\(x + c\\)</td></tr>
  </table>

  <div class="cb tip">
    <div class="cb-label">Regole di linearità</div>
    <p>Come per le derivate, l'integrale rispetta somme e multipli costanti:</p>
    <div class="math-block">\\[ \\int k\\,f(x)\\, dx = k\\int f(x)\\,dx \\qquad \\int \\big(f(x)+g(x)\\big)\\, dx = \\int f(x)\\,dx + \\int g(x)\\,dx \\]</div>
  </div>

  <p><strong>Esempio.</strong> Integriamo \\(f(x) = 3x^2 - 4x + 1\\) termine per termine:</p>
  <div class="math-block result">\\[ \\int (3x^2 - 4x + 1)\\, dx = 3\\cdot\\frac{x^3}{3} - 4\\cdot\\frac{x^2}{2} + x + c = x^3 - 2x^2 + x + c \\]</div>`
},

// ═══ 3: INTEGRALE DEFINITO E AREA ═══
{
  tag:"GEOMETRIA",
  title:"L'<em>integrale definito</em> e l'area",
  sub:"Se invece di cercare tutte le primitive vogliamo un numero preciso — l'area sotto una curva tra due punti fissati — usiamo l'integrale definito. È il secondo grande significato del simbolo di integrale.",
  nav:"Area sotto la curva",
  body:`
  <p>Consideriamo il grafico di una funzione \\(f(x)\\) tra due valori \\(a\\) e \\(b\\). L'<strong>integrale definito</strong> misura l'area della regione compresa tra la curva e l'asse \\(x\\), da \\(a\\) a \\(b\\):</p>

  ${svgAreaRetta()}

  <div class="math-block hero-formula">\\[ \\int_{a}^{b} f(x)\\, dx \\]</div>

  <div class="cb method">
    <div class="cb-label">Come si calcola</div>
    <p>Si trova una primitiva \\(F(x)\\) di \\(f(x)\\), e si calcola la differenza tra i suoi valori agli estremi:</p>
    <div class="math-block hero-formula">\\[ \\int_{a}^{b} f(x)\\, dx = F(b) - F(a) \\]</div>
    <p style="font-size:.85rem">Questa uguaglianza si chiama <strong>Teorema fondamentale del calcolo integrale</strong>: collega il calcolo di un'area (concetto geometrico) al calcolo di una primitiva (concetto algebrico).</p>
  </div>

  <p><strong>Esempio.</strong> Calcoliamo l'area sotto la retta \\(f(x) = 0{,}6x+1\\) tra \\(a=1\\) e \\(b=5\\) (la figura sopra).</p>
  <div class="step-math"><div class="label">passo 1 — la primitiva</div>\\[ F(x) = 0{,}3x^2 + x \\]</div>
  <div class="step-math"><div class="label">passo 2 — valuto agli estremi</div>\\[ F(5) = 0{,}3\\cdot25+5=12{,}5 \\qquad F(1) = 0{,}3+1=1{,}3 \\]</div>
  <div class="step-math"><div class="label green">passo 3 — la differenza</div>\\[ \\int_1^5 (0{,}6x+1)\\,dx = 12{,}5 - 1{,}3 = 11{,}2 \\]</div>

  <div class="cb success">
    <div class="cb-label">Verifica geometrica</div>
    <p>La regione è un <strong>trapezio</strong> con basi \\(f(1)=1{,}6\\) e \\(f(5)=4\\), altezza \\(4\\): l'area vale \\(\\frac{(1{,}6+4)\\cdot4}{2}=11{,}2\\). Coincide con il risultato dell'integrale: due strade diverse, stesso numero.</p>
  </div>`
},

// ═══ 4: APPROSSIMARE CON RETTANGOLI ═══
{
  tag:"IDEA GEOMETRICA",
  title:"Sommare tanti <em>rettangoli</em> sottili",
  sub:"Perché l'integrale calcola davvero un'area? L'idea intuitiva, alla base di tutto il calcolo integrale, è approssimare la regione con tanti rettangoli sottili e sommarne le aree.",
  nav:"Rettangoli",
  body:`
  <p>Quando la curva non è una retta, l'area sotto di essa non è più un poligono semplice. L'idea è dividere l'intervallo \\([a,b]\\) in tante strisce strette e approssimare ciascuna striscia con un <strong>rettangolo</strong>, la cui altezza è (circa) il valore della funzione in quel punto.</p>

  ${svgRettangoli()}

  <div class="cb tip">
    <div class="cb-label">L'idea che sta dietro all'integrale</div>
    <p>Sommando le aree di tutti questi rettangolini si ottiene un'approssimazione dell'area totale. Più i rettangoli sono <strong>stretti</strong> (e quindi numerosi), migliore è l'approssimazione. L'integrale è, in un certo senso, il risultato di questo processo portato all'estremo, con infiniti rettangoli infinitamente stretti.</p>
  </div>

  <p class="dim" style="font-size:.85rem">Non serve conoscere il procedimento rigoroso (il limite delle somme, detto somma di Riemann) per usare l'integrale: basta ricordare che il suo significato geometrico è proprio questo, una somma di aree infinitesime.</p>`
},

// ═══ 5: ESERCIZI E SINTESI ═══
{
  tag:"ESERCIZI",
  title:"Esempi <em>guidati</em>",
  sub:"Mettiamo in pratica le due regole viste finora: il calcolo di un integrale indefinito e il calcolo di un integrale definito come area. Apri ogni esercizio e segui i passaggi.",
  nav:"Esercizi",
  body:`
  ${acc([
    { t:"Es. 1 — Integrale indefinito di \\(f(x)=5x^4\\)", h:`
      <p>Applichiamo la regola delle potenze: si aumenta l'esponente di 1 e si divide per il nuovo esponente.</p>
      <div class="step-math"><div class="label">passo 1</div>\\[ \\int 5x^4\\,dx = 5\\int x^4\\,dx \\]</div>
      <div class="step-math"><div class="label">passo 2</div>\\[ = 5\\cdot\\frac{x^5}{5} + c \\]</div>
      <div class="step-math"><div class="label green">risultato</div>\\[ = x^5 + c \\]</div>` },

    { t:"Es. 2 — Integrale indefinito di un polinomio", h:`
      <p>Integriamo \\(f(x) = 4x^3 - 6x + 2\\) termine per termine, usando la linearità.</p>
      <div class="step-math"><div class="label">passo 1</div>\\[ \\int 4x^3\\,dx = x^4 \\qquad \\int 6x\\,dx = 3x^2 \\qquad \\int 2\\,dx = 2x \\]</div>
      <div class="step-math"><div class="label green">risultato</div>\\[ \\int (4x^3-6x+2)\\,dx = x^4 - 3x^2 + 2x + c \\]</div>` },

    { t:"Es. 3 — Integrale definito di \\(f(x)=x^2\\) da 0 a 3", h:`
      <p>Vogliamo l'area sotto la parabola \\(y=x^2\\) tra \\(x=0\\) e \\(x=3\\).</p>
      <div class="step-math"><div class="label">passo 1 — la primitiva</div>\\[ F(x) = \\frac{x^3}{3} \\]</div>
      <div class="step-math"><div class="label">passo 2 — valuto agli estremi</div>\\[ F(3) = \\frac{27}{3}=9 \\qquad F(0) = 0 \\]</div>
      <div class="step-math"><div class="label green">risultato</div>\\[ \\int_0^3 x^2\\,dx = 9 - 0 = 9 \\]</div>
      <p>L'area sotto la parabola, tra 0 e 3, vale esattamente 9 unità quadrate.</p>` },

    { t:"Es. 4 — Guidato: area sotto una retta orizzontale", h:`
      <p>Verifichiamo l'integrale con un caso semplicissimo: \\(f(x) = 4\\) (una costante), da \\(x=2\\) a \\(x=6\\).</p>
      <div class="step-math"><div class="label">passo 1 — la primitiva</div>\\[ F(x) = 4x \\]</div>
      <div class="step-math"><div class="label">passo 2 — valuto agli estremi</div>\\[ F(6)=24 \\qquad F(2)=8 \\]</div>
      <div class="step-math"><div class="label green">passo 3 — la differenza</div>\\[ \\int_2^6 4\\,dx = 24-8=16 \\]</div>
      <p>Verifica geometrica: è un rettangolo di base \\(6-2=4\\) e altezza \\(4\\), quindi area \\(=4\\times4=16\\). Coincide.</p>` }
  ])}

  <h3>In sintesi</h3>
  <ul class="checklist">
    <li>La primitiva \\(F(x)\\) è una funzione tale che \\(F'(x)=f(x)\\)</li>
    <li>Le primitive di una stessa funzione differiscono solo per una costante \\(c\\)</li>
    <li>Integrale indefinito: \\(\\int x^n\\,dx = \\frac{x^{n+1}}{n+1}+c\\)</li>
    <li>L'integrale definito \\(\\int_a^b f(x)\\,dx\\) misura l'area sotto la curva tra \\(a\\) e \\(b\\)</li>
    <li>Si calcola con \\(F(b)-F(a)\\), dove \\(F\\) è una primitiva di \\(f\\)</li>
    <li>Geometricamente, è la somma di infiniti rettangoli sottilissimi</li>
  </ul>

  <div class="cb success">
    <div class="cb-label">Un ultimo sguardo d'insieme</div>
    <p>Il calcolo integrale nasce da due domande diverse — "qual è l'area sotto una curva?" e "come torno indietro da una derivata?" — che si scoprono essere <strong>la stessa domanda</strong>. È uno dei collegamenti più belli di tutta la matematica.</p>
  </div>`
}

];

// ══════════════════════════
// APP LOGIC
// ══════════════════════════
let cur = 0;
const tot = S.length;

function render() {
  document.getElementById('topNav').innerHTML = S.map((s,i) =>
    `<button class="nav-pill ${i===cur?'active':''}" onclick="goTo(${i})">${s.nav}</button>`
  ).join('');

  document.getElementById('app').innerHTML = S.map((s,i) => `
    <div class="section ${i===cur?'active':''}">
      <div class="hero">
        <div class="hero-tag">${s.tag}</div>
        <h1>${s.title}</h1>
        <p class="hero-sub">${s.sub}</p>
      </div>
      ${s.body}
      <div class="bottom-nav">
        <button class="bb" onclick="goTo(${i-1})" ${i===0?'disabled':''}>← Precedente</button>
        <span class="page-info">${i+1} / ${tot}</span>
        <button class="bb primary" onclick="goTo(${i+1})" ${i===tot-1?'disabled':''}>Successivo →</button>
      </div>
    </div>
  `).join('');

  if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
    const active = document.querySelector('.section.active');
    if (active) MathJax.typesetPromise([active]);
  }

  document.querySelectorAll('.checklist li').forEach(li => {
    li.onclick = function(e) {
      e.stopPropagation();
      this.classList.toggle('checked');
    };
  });
}

function goTo(idx) {
  if (idx < 0 || idx >= tot) return;
  cur = idx;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goTo(cur + 1);
  if (e.key === 'ArrowLeft')  goTo(cur - 1);
});

if (typeof MathJax !== 'undefined' && MathJax.startup) {
  MathJax.startup.promise.then(() => render());
} else {
  render();
  document.body.style.opacity = '1';
}
</script>
</body>
</html>
