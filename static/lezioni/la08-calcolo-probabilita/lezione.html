<script>
function acc(items) {
  return '<div class="accordion">' + items.map((it, i) =>
    '<div class="acc-item">' +
      '<div class="acc-header" onclick="toggleAcc(this)">' +
        '<div class="acc-num">' + (i + 1) + '</div>' +
        '<div class="acc-title">' + it.t + '</div>' +
        '<svg class="acc-arrow" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
      '</div>' +
      '<div class="acc-body"><div class="acc-inner">' + it.h + '</div></div>' +
    '</div>'
  ).join('') + '</div>';
}

function toggleAcc(el) {
  const item = el.parentElement;
  item.classList.toggle('open');
  if (item.classList.contains('open') && typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([item]);
  }
}

const S = [
{
  tag:"FONDAMENTI",
  title:"Misurare l'<em>incertezza</em>",
  nav:"Perché",
  body:
    '<p>Molti fenomeni del mondo reale non sono prevedibili con certezza: il lancio di una moneta, il tempo di domani, l\'esito di una partita. La <strong>probabilità</strong> è lo strumento matematico che permette di quantificare questa incertezza con un numero preciso.</p>' +
    '<div class="cb"><div class="cb-label">Il concetto</div><p>La probabilità di un evento è un numero compreso tra <strong>0</strong> (evento impossibile) e <strong>1</strong> (evento certo). Quanto più il valore è vicino a 1, tanto più siamo fiduciosi che l\'evento accada.</p></div>' +
    '<p>Spesso la probabilità si esprime anche in percentuale: \\(P = 0{,}25\\) equivale al 25%.</p>' +
    '<h3>La scala della probabilità</h3>' +
    '<table class="ct"><tr><th>Valore</th><th>Significato</th><th>Esempio</th></tr>' +
    '<tr><td>0</td><td>impossibile</td><td>uscita del 7 con un dado</td></tr>' +
    '<tr><td>0,5</td><td>tanto probabile quanto no</td><td>testa lanciando una moneta</td></tr>' +
    '<tr><td>1</td><td>certo</td><td>uscita di un numero da 1 a 6 con un dado</td></tr></table>' +
    '<div class="cb tip"><div class="cb-label">Un po\' di storia</div><p>Il calcolo delle probabilità nasce nel Seicento dalla corrispondenza tra <strong>Blaise Pascal</strong> e <strong>Pierre de Fermat</strong> su alcuni problemi legati al gioco d\'azzardo. Solo nel 1933 <strong>Andrej Kolmogorov</strong> ne diede una sistemazione assiomatica rigorosa.</p></div>' +
    '<p>In questa lezione partiamo dai concetti di base (spazio campionario ed eventi), definiamo la probabilità in tre modi equivalenti, impariamo a combinarla con le regole della somma e del prodotto, e arriviamo alla <em>probabilità condizionata</em> e al <em>teorema di Bayes</em>, che ci permettono di aggiornare le nostre stime alla luce di nuove informazioni.</p>'
},
{
  tag:"SPAZI E EVENTI",
  title:"Spazio campionario e <em>eventi</em>",
  nav:"Spazio",
  body:
    '<p>Un <strong>esperimento casuale</strong> (o aleatorio) è una prova il cui risultato non è prevedibile in anticipo, ma i cui esiti possibili sono tutti noti.</p>' +
    '<div class="cb"><div class="cb-label">Spazio campionario Ω</div><p>È l\'insieme di <strong>tutti</strong> i possibili esiti di un esperimento.</p>' +
    '<ul><li>Lancio di un dado: \\(\\Omega = \\{1,2,3,4,5,6\\}\\)</li><li>Lancio di una moneta: \\(\\Omega = \\{T, C\\}\\)</li></ul></div>' +
    '<h3>Eventi</h3>' +
    '<p>Un <strong>evento</strong> è un sottoinsieme dello spazio campionario, cioè un insieme di esiti che ci interessano. L\'evento "esce un numero pari" con il dado è \\(A = \\{2,4,6\\}\\).</p>' +
    '<ul><li><strong>Evento elementare:</strong> è formato da un solo esito, ad es. \\(\\{3\\}\\)</li>' +
    '<li><strong>Evento certo:</strong> coincide con tutto \\(\\Omega\\)</li>' +
    '<li><strong>Evento impossibile:</strong> è l\'insieme vuoto \\(\\varnothing\\)</li></ul>' +
    '<h3>Operazioni tra eventi</h3>' +
    '<p>Poiché gli eventi sono insiemi, si combinano con le operazioni insiemistiche, che in probabilità hanno un significato preciso:</p>' +
    '<table class="ct"><tr><th>Simbolo</th><th>Nome</th><th>Significato</th></tr>' +
    '<tr><td>\\(A \\cup B\\)</td><td>unione</td><td>accade A <strong>oppure</strong> B (o entrambi)</td></tr>' +
    '<tr><td>\\(A \\cap B\\)</td><td>intersezione</td><td>accadono A <strong>e</strong> B insieme</td></tr>' +
    '<tr><td>\\(\\bar{A}\\)</td><td>complementare</td><td>A <strong>non</strong> accade</td></tr></table>' +
    '<div class="cb warn"><div class="cb-label">Eventi incompatibili</div><p>Due eventi si dicono <strong>incompatibili</strong> (o mutuamente esclusivi) se non possono verificarsi contemporaneamente, cioè \\(A \\cap B = \\varnothing\\). Esempio: con un dado, "esce pari" e "esce 3" sono incompatibili.</p></div>' +
    acc([
      { t:"Esempio 1 — Lancio di due dadi", h:'<p>Lanciando due dadi, lo spazio campionario è formato da tutte le coppie ordinate \\((a,b)\\):</p><div class="math-block">\\[ |\\Omega| = 6 \\times 6 = 36 \\]</div><p>L\'evento "la somma è 7" è \\(A = \\{(1,6),(2,5),(3,4),(4,3),(5,2),(6,1)\\}\\), quindi \\(|A| = 6\\).</p>' },
      { t:"Esempio 2 — Estrazione di una carta", h:'<p>Da un mazzo di 40 carte estraiamo una carta. Qui \\(|\\Omega| = 40\\).</p><ul><li>Evento "esce una figura": \\(|A| = 12\\) (3 figure per ognuno dei 4 semi)</li><li>Evento "esce una carta di denari": \\(|B| = 10\\)</li></ul><p>L\'intersezione "figura di denari" ha 3 elementi: \\(|A \\cap B| = 3\\).</p>' }
    ])
},
{
  tag:"TEORIA",
  title:"Tre definizioni di <em>probabilità</em>",
  nav:"Definizioni",
  body:
    '<p>Esistono tre modi di definire la probabilità. Non sono in contraddizione: descrivono situazioni diverse ma portano a risultati coerenti.</p>' +
    '<h3>1. Definizione classica</h3>' +
    '<p>Vale quando tutti gli esiti sono <strong>equiprobabili</strong> (nessuno è privilegiato). È la definizione di Laplace:</p>' +
    '<div class="math-block hero-formula">\\[ P(A) = \\frac{\\text{casi favorevoli}}{\\text{casi possibili}} = \\frac{|A|}{|\\Omega|} \\tag{C} \\]</div>' +
    '<p><strong>Esempio:</strong> con un dado, \\(P(\\text{pari}) = \\dfrac{3}{6} = \\dfrac{1}{2}\\).</p>' +
    '<div class="cb warn"><div class="cb-label">Attenzione</div><p>La formula (C) si può usare <strong>solo</strong> se gli esiti sono equiprobabili. Con un dado truccato non vale.</p></div>' +
    '<h3>2. Definizione frequentista</h3>' +
    '<p>Quando gli esiti non sono equiprobabili (o non sappiamo se lo siano), stimiamo la probabilità ripetendo molte volte l\'esperimento e osservando la <strong>frequenza relativa</strong>:</p>' +
    '<div class="math-block hero-formula">\\[ P(A) \\approx \\frac{\\text{numero di volte in cui accade } A}{\\text{numero totale di prove}} \\]</div>' +
    '<p>La <strong>legge dei grandi numeri</strong> garantisce che, all\'aumentare delle prove, la frequenza relativa si avvicina alla probabilità teorica.</p>' +
    '<h3>3. Definizione assiomatica (Kolmogorov)</h3>' +
    '<p>È la definizione più generale. Una funzione \\(P\\) che a ogni evento associa un numero è una probabilità se soddisfa tre assiomi:</p>' +
    '<div class="cb purple"><div class="cb-label">Assiomi di Kolmogorov</div>' +
    '<ol><li>\\(P(A) \\geq 0\\) per ogni evento \\(A\\)</li>' +
    '<li>\\(P(\\Omega) = 1\\)</li>' +
    '<li>se \\(A\\) e \\(B\\) sono incompatibili, allora \\(P(A \\cup B) = P(A) + P(B)\\)</li></ol></div>' +
    '<p>Da questi tre assiomi discendono <strong>tutte</strong> le proprietà della probabilità. Ad esempio la probabilità dell\'evento complementare:</p>' +
    '<div class="math-block result">\\[ P(\\bar{A}) = 1 - P(A) \\]</div>' +
    acc([
      { t:"Esercizio svolto — Probabilità del complementare", h:'<p>Qual è la probabilità che lanciando due dadi la somma <strong>non</strong> sia 7?</p><p>Sappiamo che \\(P(\\text{somma}=7) = \\dfrac{6}{36} = \\dfrac{1}{6}\\). Usando il complementare:</p><div class="math-block">\\[ P(\\text{somma} \\neq 7) = 1 - \\frac{1}{6} = \\frac{5}{6} \\]</div><p class="dim">Calcolare il complementare è spesso molto più rapido che contare tutti i casi favorevoli.</p>' },
      { t:"Esercizio svolto — Definizione classica", h:'<p>Un\'urna contiene 4 palline rosse, 5 verdi e 3 blu. Qual è la probabilità di estrarre una pallina <strong>non</strong> verde?</p><p>Totale palline: \\(4+5+3 = 12\\). Palline non verdi: \\(4+3 = 7\\).</p><div class="math-block result">\\[ P(\\text{non verde}) = \\frac{7}{12} \\approx 0{,}583 \\]</div>' }
    ])
},
{
  tag:"OPERAZIONI",
  title:"Regola della somma e del <em>prodotto</em>",
  nav:"Combinare",
  body:
    '<p>Le due regole fondamentali per combinare probabilità rispondono a due domande diverse: "A <strong>oppure</strong> B?" e "A <strong>e</strong> B?".</p>' +
    '<h3>Regola della somma (unione)</h3>' +
    '<p>Per la probabilità che accada A <strong>oppure</strong> B:</p>' +
    '<div class="math-block hero-formula">\\[ P(A \\cup B) = P(A) + P(B) - P(A \\cap B) \\tag{S} \\]</div>' +
    '<p>Si sottrae \\(P(A \\cap B)\\) per non contare due volte gli esiti comuni. Se gli eventi sono <strong>incompatibili</strong> l\'intersezione è vuota e la formula si semplifica:</p>' +
    '<div class="math-block result">\\[ P(A \\cup B) = P(A) + P(B) \\qquad (\\text{se } A \\cap B = \\varnothing) \\]</div>' +
    '<h3>Regola del prodotto (intersezione)</h3>' +
    '<p>Per la probabilità che accadano A <strong>e</strong> B insieme:</p>' +
    '<div class="math-block hero-formula">\\[ P(A \\cap B) = P(A) \\cdot P(B|A) \\tag{P} \\]</div>' +
    '<p>dove \\(P(B|A)\\) è la <em>probabilità condizionata</em> di B sapendo che A è accaduto (la vediamo nella prossima sezione).</p>' +
    '<div class="cb success"><div class="cb-label">Caso speciale: eventi indipendenti</div><p>Se A e B sono indipendenti, il verificarsi di A non cambia la probabilità di B, cioè \\(P(B|A) = P(B)\\), e la formula diventa:</p><div class="math-block">\\[ P(A \\cap B) = P(A) \\cdot P(B) \\]</div></div>' +
    acc([
      { t:"Esercizio svolto — Regola della somma", h:'<p>Estraiamo una carta da un mazzo di 40. Qual è la probabilità che sia una figura <strong>oppure</strong> una carta di denari?</p><p>\\(P(\\text{figura}) = \\dfrac{12}{40}\\), \\(P(\\text{denari}) = \\dfrac{10}{40}\\), \\(P(\\text{figura di denari}) = \\dfrac{3}{40}\\).</p><div class="math-block">\\[ P(F \\cup D) = \\frac{12}{40} + \\frac{10}{40} - \\frac{3}{40} = \\frac{19}{40} \\]</div><div class="math-block result">\\[ P(F \\cup D) = \\frac{19}{40} = 0{,}475 \\]</div>' },
      { t:"Esercizio svolto — Regola del prodotto (indipendenti)", h:'<p>Lanciamo due dadi. Qual è la probabilità che il primo sia 3 <strong>e</strong> il secondo sia 5?</p><p>I due lanci sono indipendenti:</p><div class="math-block result">\\[ P = \\frac{1}{6} \\cdot \\frac{1}{6} = \\frac{1}{36} \\]</div>' },
      { t:"Esercizio svolto — Prodotto senza reimmissione", h:'<p>Un\'urna ha 5 palline rosse e 3 nere. Estraiamo 2 palline <strong>senza rimetterle</strong>. Probabilità che siano entrambe rosse?</p><p>Alla prima estrazione: \\(P(R_1) = \\dfrac{5}{8}\\). Alla seconda, restano 4 rosse su 7 palline: \\(P(R_2|R_1) = \\dfrac{4}{7}\\).</p><div class="math-block">\\[ P(R_1 \\cap R_2) = \\frac{5}{8} \\cdot \\frac{4}{7} = \\frac{20}{56} \\]</div><div class="math-block result">\\[ P(R_1 \\cap R_2) = \\frac{5}{14} \\approx 0{,}357 \\]</div>' }
    ])
},
{
  tag:"CHIAVE",
  title:"Probabilità <em>condizionata</em>",
  nav:"Condizionata",
  body:
    '<p>La probabilità condizionata risponde alla domanda: come cambia la probabilità di B quando <strong>sappiamo già</strong> che A è accaduto? L\'informazione aggiuntiva restringe lo spazio campionario.</p>' +
    '<div class="cb"><div class="cb-label">Definizione</div><div class="math-block hero-formula">\\[ P(B|A) = \\frac{P(A \\cap B)}{P(A)} \\qquad (\\text{con } P(A) > 0) \\tag{K} \\]</div></div>' +
    '<p>L\'idea è che, sapendo che A è accaduto, i casi possibili non sono più tutto \\(\\Omega\\) ma solo quelli dentro A: contiamo dentro A quanti realizzano anche B.</p>' +
    '<h3>Esempio guidato</h3>' +
    '<p>Lanciamo due dadi e ci dicono che la somma è \\(\\geq 10\\). Qual è la probabilità che il primo dado valga 5?</p>' +
    '<ul><li>\\(A = \\text{"somma} \\geq 10\\text{"} = \\{(4,6),(5,5),(5,6),(6,4),(6,5),(6,6)\\}\\), quindi \\(|A| = 6\\)</li>' +
    '<li>\\(A \\cap B = \\text{"primo}=5\\text{ e somma}\\geq 10\\text{"} = \\{(5,5),(5,6)\\}\\), quindi \\(|A \\cap B| = 2\\)</li></ul>' +
    '<div class="math-block result">\\[ P(B|A) = \\frac{2/36}{6/36} = \\frac{2}{6} = \\frac{1}{3} \\]</div>' +
    '<h3>Teorema di Bayes</h3>' +
    '<p>Il teorema di Bayes permette di <strong>capovolgere</strong> il condizionamento: se conosciamo \\(P(B|A)\\), possiamo ricavare \\(P(A|B)\\). Serve a risalire dalle conseguenze osservate (B) alle possibili cause (A).</p>' +
    '<div class="math-block hero-formula">\\[ P(A|B) = \\frac{P(B|A) \\cdot P(A)}{P(B)} \\tag{B} \\]</div>' +
    '<p>Spesso il denominatore \\(P(B)\\) si calcola con la <strong>formula delle probabilità totali</strong>:</p>' +
    '<div class="math-block">\\[ P(B) = P(B|A)\\,P(A) + P(B|\\bar{A})\\,P(\\bar{A}) \\]</div>' +
    acc([
      { t:"Esercizio svolto — Condizionata con le carte", h:'<p>Estraiamo una carta da un mazzo di 40. Sappiamo che è una figura. Qual è la probabilità che sia un re?</p><p>Le figure sono 12 (re, donne, fanti), i re sono 4.</p><div class="math-block result">\\[ P(\\text{re}\\,|\\,\\text{figura}) = \\frac{4}{12} = \\frac{1}{3} \\]</div>' },
      { t:"Esercizio svolto — Bayes (le due urne)", h:'<p>Ci sono due urne: l\'urna 1 con 3 rosse e 1 bianca, l\'urna 2 con 1 rossa e 3 bianche. Scegliamo un\'urna a caso ed estraiamo una pallina rossa. Qual è la probabilità che venisse dall\'urna 1?</p><p>Poniamo \\(P(U_1)=P(U_2)=\\tfrac{1}{2}\\), \\(P(R|U_1)=\\tfrac{3}{4}\\), \\(P(R|U_2)=\\tfrac{1}{4}\\).</p><p>Probabilità totale di estrarre rossa:</p><div class="math-block">\\[ P(R) = \\frac{1}{2}\\cdot\\frac{3}{4} + \\frac{1}{2}\\cdot\\frac{1}{4} = \\frac{4}{8} = \\frac{1}{2} \\]</div><p>Applichiamo Bayes:</p><div class="math-block result">\\[ P(U_1|R) = \\frac{\\frac{1}{2}\\cdot\\frac{3}{4}}{\\frac{1}{2}} = \\frac{3}{4} \\]</div>' }
    ])
},
{
  tag:"RELAZIONI",
  title:"Indipendenza fra <em>eventi</em>",
  nav:"Indipendenza",
  body:
    '<p>Due eventi A e B sono <strong>indipendenti</strong> se il verificarsi di uno non modifica la probabilità dell\'altro. È una delle nozioni più usate — e più fraintese — del calcolo delle probabilità.</p>' +
    '<div class="cb"><div class="cb-label">Definizione di indipendenza</div><p>A e B sono indipendenti se e solo se:</p><div class="math-block hero-formula">\\[ P(A \\cap B) = P(A) \\cdot P(B) \\]</div><p>In modo equivalente: \\(P(B|A) = P(B)\\), cioè sapere che A è accaduto non cambia nulla su B.</p></div>' +
    '<h3>Prove indipendenti ripetute</h3>' +
    '<p>Se ripetiamo \\(n\\) volte, in modo indipendente, uno stesso esperimento, e in ogni prova l\'evento A ha probabilità \\(p\\), allora la probabilità che A si verifichi in <strong>tutte</strong> le \\(n\\) prove è:</p>' +
    '<div class="math-block hero-formula">\\[ P(\\text{A in tutte le } n \\text{ prove}) = p^{\\,n} \\]</div>' +
    '<p>Analogamente, la probabilità che A <strong>non</strong> si verifichi mai in \\(n\\) prove è \\((1-p)^n\\), da cui la probabilità che si verifichi <strong>almeno una volta</strong>:</p>' +
    '<div class="math-block result">\\[ P(\\text{almeno una volta}) = 1 - (1-p)^n \\]</div>' +
    '<div class="cb danger"><div class="cb-label">Attenzione: indipendenza ≠ incompatibilità</div><p>Sono due concetti diversi e spesso confusi. Se A e B sono <strong>incompatibili</strong> (non possono accadere insieme) e hanno probabilità non nulla, allora <strong>non</strong> sono indipendenti: sapere che è accaduto A ci dice con certezza che B non è accaduto.</p></div>' +
    acc([
      { t:"Esercizio svolto — Almeno un 6", h:'<p>Lanciamo un dado 4 volte. Qual è la probabilità di ottenere <strong>almeno un</strong> 6?</p><p>In un singolo lancio \\(P(6) = \\tfrac{1}{6}\\), quindi \\(P(\\text{non 6}) = \\tfrac{5}{6}\\). I lanci sono indipendenti:</p><div class="math-block">\\[ P(\\text{nessun 6}) = \\left(\\frac{5}{6}\\right)^4 = \\frac{625}{1296} \\]</div><div class="math-block result">\\[ P(\\text{almeno un 6}) = 1 - \\frac{625}{1296} = \\frac{671}{1296} \\approx 0{,}518 \\]</div>' },
      { t:"Esercizio svolto — Verificare l\'indipendenza", h:'<p>Con un dado, siano \\(A = \\text{"pari"} = \\{2,4,6\\}\\) e \\(B = \\text{"maggiore di 3"} = \\{4,5,6\\}\\). Sono indipendenti?</p><p>\\(P(A) = \\tfrac{3}{6} = \\tfrac{1}{2}\\), \\(P(B) = \\tfrac{3}{6} = \\tfrac{1}{2}\\). L\'intersezione \\(A \\cap B = \\{4,6\\}\\), quindi \\(P(A \\cap B) = \\tfrac{2}{6} = \\tfrac{1}{3}\\).</p><p>Confrontiamo con il prodotto: \\(P(A)\\cdot P(B) = \\tfrac{1}{2}\\cdot\\tfrac{1}{2} = \\tfrac{1}{4}\\).</p><div class="math-block warning">\\[ \\frac{1}{3} \\neq \\frac{1}{4} \\;\\Rightarrow\\; A \\text{ e } B \\text{ NON sono indipendenti} \\]</div>' }
    ])
},
{
  tag:"PRATICA",
  title:"Esercizi e <em>sintesi</em>",
  nav:"Esercizi",
  body:
    '<p>Raccogliamo qui alcuni problemi completi che mettono insieme le regole viste. Prova a risolverli da solo prima di aprire la soluzione.</p>' +
    acc([
      { t:"Problema 1 — Urna senza reimmissione", h:'<p>Un\'urna contiene 5 palline rosse, 3 blu e 2 gialle. Estraiamo 2 palline senza rimetterle. Qual è la probabilità che siano entrambe rosse?</p><p>Totale: 10 palline. Con la regola del prodotto:</p><div class="math-block">\\[ P(RR) = \\frac{5}{10} \\cdot \\frac{4}{9} = \\frac{20}{90} \\]</div><div class="math-block result">\\[ P(RR) = \\frac{2}{9} \\approx 0{,}222 \\]</div>' },
      { t:"Problema 2 — Almeno una pallina blu", h:'<p>Stessa urna (5 rosse, 3 blu, 2 gialle). Estraiamo 2 palline senza reimmissione. Qual è la probabilità di ottenere <strong>almeno una</strong> blu?</p><p>Conviene passare al complementare "nessuna blu". Le non-blu sono 7:</p><div class="math-block">\\[ P(\\text{nessuna blu}) = \\frac{7}{10} \\cdot \\frac{6}{9} = \\frac{42}{90} = \\frac{7}{15} \\]</div><div class="math-block result">\\[ P(\\text{almeno una blu}) = 1 - \\frac{7}{15} = \\frac{8}{15} \\approx 0{,}533 \\]</div>' },
      { t:"Problema 3 — Test medico (Bayes)", h:'<p>Una malattia colpisce lo 0,1% della popolazione. Un test la individua nel 95% dei malati (sensibilità) e dà un falso positivo nel 5% dei sani. Se il test risulta positivo, qual è la probabilità di essere davvero malati?</p><p>Poniamo \\(M = \\text{malato}\\), \\(+ = \\text{test positivo}\\).</p><p>\\(P(M) = 0{,}001\\), \\(P(+|M) = 0{,}95\\), \\(P(+|\\bar{M}) = 0{,}05\\).</p><p>Probabilità totale di test positivo:</p><div class="math-block">\\[ P(+) = 0{,}95 \\cdot 0{,}001 + 0{,}05 \\cdot 0{,}999 = 0{,}0509 \\]</div><p>Applichiamo Bayes:</p><div class="math-block result">\\[ P(M|+) = \\frac{0{,}95 \\cdot 0{,}001}{0{,}0509} \\approx 0{,}0187 = 1{,}87\\% \\]</div><p class="dim">Sorprendente: nonostante il test sia molto affidabile, la probabilità reale di essere malati è solo del 1,87%, perché la malattia è talmente rara che i falsi positivi superano di gran lunga i veri positivi.</p>' },
      { t:"Problema 4 — Compleanni (almeno una coincidenza)", h:'<p>In una classe di 23 studenti, qual è la probabilità che almeno due compiano gli anni lo stesso giorno? (365 giorni, indipendenti)</p><p>Passiamo al complementare "tutti compleanni diversi":</p><div class="math-block">\\[ P(\\text{tutti diversi}) = \\frac{365}{365} \\cdot \\frac{364}{365} \\cdots \\frac{343}{365} \\approx 0{,}493 \\]</div><div class="math-block result">\\[ P(\\text{almeno due uguali}) \\approx 1 - 0{,}493 = 0{,}507 \\]</div><p class="dim">Basta una classe di 23 persone perché la coincidenza sia più probabile del contrario: è il celebre "paradosso dei compleanni".</p>' }
    ]) +
    '<h3>Formule da ricordare</h3>' +
    '<table class="ct"><tr><th>Concetto</th><th>Formula</th></tr>' +
    '<tr><td>Definizione classica</td><td>\\(P(A) = \\dfrac{|A|}{|\\Omega|}\\)</td></tr>' +
    '<tr><td>Complementare</td><td>\\(P(\\bar{A}) = 1 - P(A)\\)</td></tr>' +
    '<tr><td>Somma (unione)</td><td>\\(P(A \\cup B) = P(A)+P(B)-P(A \\cap B)\\)</td></tr>' +
    '<tr><td>Prodotto</td><td>\\(P(A \\cap B) = P(A)\\,P(B|A)\\)</td></tr>' +
    '<tr><td>Indipendenza</td><td>\\(P(A \\cap B) = P(A)\\,P(B)\\)</td></tr>' +
    '<tr><td>Condizionata</td><td>\\(P(B|A) = \\dfrac{P(A \\cap B)}{P(A)}\\)</td></tr>' +
    '<tr><td>Bayes</td><td>\\(P(A|B) = \\dfrac{P(B|A)\\,P(A)}{P(B)}\\)</td></tr>' +
    '<tr><td>Almeno una volta</td><td>\\(1 - (1-p)^n\\)</td></tr></table>' +
    '<div class="cb success"><div class="cb-label">Strategia risolutiva</div><p>Quando in un problema compare "<strong>almeno uno</strong>", quasi sempre conviene calcolare il complementare "<strong>nessuno</strong>" e sottrarre da 1: è molto più rapido che sommare tutti i casi favorevoli.</p></div>'
}
];

let currentIdx = 0;

function render() {
  const s = S[currentIdx];
  const html = '<div class="hero">' +
    '<div class="hero-tag">' + s.tag + '</div>' +
    '<h1>' + s.title + '</h1></div>' +
    '<div class="section-body">' + s.body + '</div>' +
    '<div class="bottom-nav">' +
    '<button class="bb" onclick="prev()" ' + (currentIdx === 0 ? 'disabled' : '') + '>← Indietro</button>' +
    '<div class="page-info">' + (currentIdx + 1) + ' / ' + S.length + '</div>' +
    '<button class="bb" onclick="next()" ' + (currentIdx === S.length - 1 ? 'disabled' : '') + '>Avanti →</button>' +
    '</div>';

  document.getElementById('app').innerHTML = html;

  const pills = S.map((s, i) =>
    '<button class="nav-pill ' + (i === currentIdx ? 'active' : '') + '" onclick="go(' + i + ')">' + s.nav + '</button>'
  ).join('');
  document.getElementById('topNav').innerHTML = pills;

  if (typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([document.getElementById('app')]);
  }
  document.body.style.opacity = '1';
}

function prev() { if (currentIdx > 0) { currentIdx--; render(); window.scrollTo(0, 0); } }
function next() { if (currentIdx < S.length - 1) { currentIdx++; render(); window.scrollTo(0, 0); } }
function go(i) { currentIdx = i; render(); window.scrollTo(0, 0); }

render();
</script>
</body>
</html>
