document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"70239206-7bc4-4aad-9370-275ecde98286\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body{margin:0;background:#faf7f2;font-family:Georgia,'Times New Roman',serif;color:#2c2520;-webkit-font-smoothing:antialiased;}\n  *{box-sizing:border-box;}\n  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}\n  ::selection{background:#fce4ec;}\n  button{font:inherit;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;\">\n\n  <header style=\"position:sticky;top:0;z-index:50;background:rgba(250,247,242,.93);backdrop-filter:blur(8px);border-bottom:1px solid #ece7de;\">\n    <div style=\"max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:14px 32px;\">\n      <div style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:1.02rem;color:#2c2520;white-space:nowrap;\">Modelli · Equazioni di 1° grado<\u002Fdiv>\n      <div style=\"flex:1;display:flex;gap:5px;align-items:center;justify-content:center;\">\n        <sc-for list=\"{{ dots }}\" as=\"d\" hint-placeholder-count=\"11\">\n          <span style=\"{{ d.style }}\"><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:.78rem;color:#6e6760;white-space:nowrap;\">{{ counter }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"max-width:1080px;margin:0 auto;padding:46px 32px 90px;\">\n    <div style=\"{{ gridStyle }}\">\n\n      <div>\n\n        <sc-if value=\"{{ isIntro }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"animation:fadeUp .5s ease;\">\n            <div style=\"font-family:'Fira Code',monospace;font-size:.72rem;letter-spacing:2.5px;text-transform:uppercase;color:#c2185b;margin-bottom:16px;\">Matematica · Modelli dal mondo reale<\u002Fdiv>\n            <h1 style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(2.1rem,5vw,3.1rem);line-height:1.12;margin:0 0 22px;color:#2c2520;\">Un problema vero,<br>un'equazione come <em style=\"font-style:italic;color:#c2185b;\">modello<\u002Fem><\u002Fh1>\n            <p style=\"font-size:1.1rem;line-height:1.75;color:#5a524a;max-width:610px;margin:0 0 18px;\">Non si parte dai numeri. Si parte da una decisione che potresti dover prendere domani. Il lavoro è uno solo: trasformare le parole in un'equazione di primo grado — e poi farla parlare.<\u002Fp>\n            <p style=\"font-size:1.02rem;line-height:1.7;color:#6e6760;max-width:610px;margin:0;\">Ad ogni passo scegli tu. Sbagliare è permesso, anzi: serve a capire dove si inciampa. Alla fine non avrai solo un numero, ma una decisione.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isProblem }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:fadeUp .4s ease;\">\n            <div style=\"font-family:'Fira Code',monospace;font-size:.72rem;letter-spacing:2.5px;text-transform:uppercase;color:#c2185b;margin-bottom:14px;\">Il problema<\u002Fdiv>\n            <h1 style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.14;margin:0 0 18px;color:#2c2520;\">La grande promessa di <em style=\"font-style:italic;color:#c2185b;\">gennaio<\u002Fem><\u002Fh1>\n            <p style=\"font-size:1.05rem;line-height:1.75;color:#5a524a;margin:0 0 8px;\">Ogni anno, il 2 gennaio, Bruno pronuncia la stessa frase solenne: «Quest'anno mi rimetto in forma». Stavolta fa sul serio — dice. Si presenta alla palestra <strong>Olimpo Fitness<\u002Fstrong> e l'addetto gli mette davanti due tariffe.<\u002Fp>\n\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:26px 0;\">\n              <div style=\"background:#fff;border:1px solid #e4ddd4;border-radius:10px;padding:20px;\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:1.6px;text-transform:uppercase;color:#c2185b;font-weight:700;margin-bottom:10px;\">Tariffa Libera<\u002Fdiv>\n                <div style=\"font-family:'Playfair Display',serif;font-size:1.55rem;font-weight:700;margin-bottom:8px;color:#2c2520;\">5 € <span style=\"font-size:.92rem;font-weight:400;color:#6e6760;\">a ingresso<\u002Fspan><\u002Fdiv>\n                <p style=\"font-size:.92rem;color:#5a524a;margin:0;line-height:1.55;\">Paghi solo quando entri. Nessun abbonamento mensile.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #e4ddd4;border-radius:10px;padding:20px;\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:1.6px;text-transform:uppercase;color:#3a6b8c;font-weight:700;margin-bottom:10px;\">Tariffa Smart<\u002Fdiv>\n                <div style=\"font-family:'Playfair Display',serif;font-size:1.55rem;font-weight:700;margin-bottom:8px;color:#2c2520;\">36 € <span style=\"font-size:.92rem;font-weight:400;color:#6e6760;\">al mese<\u002Fspan> + 2 € <span style=\"font-size:.92rem;font-weight:400;color:#6e6760;\">a ingresso<\u002Fspan><\u002Fdiv>\n                <p style=\"font-size:.92rem;color:#5a524a;margin:0;line-height:1.55;\">Quota fissa mensile, poi paghi molto meno ogni volta.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#f5f0e8;border-left:2px solid #c2185b;padding:16px 20px;border-radius:0 8px 8px 0;\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:1.5px;text-transform:uppercase;color:#c2185b;font-weight:700;margin-bottom:6px;\">La domanda<\u002Fdiv>\n              <p style=\"font-size:1.06rem;color:#2c2520;margin:0;line-height:1.62;\">Dopo quanti ingressi in un mese le due tariffe vengono a costare <strong>uguale<\u002Fstrong>? E soprattutto: quale dovrebbe scegliere davvero Bruno?<\u002Fp>\n            <\u002Fdiv>\n            <p style=\"font-family:'Fira Code',monospace;font-size:.82rem;color:#6e6760;margin:20px 0 0;\">Sembra una domanda da supermercato. È un'equazione travestita.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isChoice }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:fadeUp .4s ease;\">\n            <div style=\"font-family:'Fira Code',monospace;font-size:.7rem;letter-spacing:2.2px;text-transform:uppercase;color:#c2185b;margin-bottom:13px;\">{{ tag }}<\u002Fdiv>\n            <h2 style=\"font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(1.4rem,2.8vw,1.9rem);line-height:1.26;color:#2c2520;margin:0 0 10px;\">{{ q }}<\u002Fh2>\n            <p style=\"font-size:.96rem;color:#6e6760;margin:0 0 26px;line-height:1.6;\">{{ hint }}<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:11px;\">\n              <sc-for list=\"{{ opts }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                <button onclick=\"{{ opt.onClick }}\" style=\"{{ opt.card }}\" style-hover=\"border-color:#c2185b;\">\n                  <span style=\"{{ opt.letterStyle }}\">{{ opt.letter }}<\u002Fspan>\n                  <span style=\"{{ opt.labelStyle }}\">{{ opt.label }}<\u002Fspan>\n                  <span style=\"{{ opt.iconStyle }}\">{{ opt.icon }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ feedback }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"{{ feedbackStyle }}\">\n                <div style=\"{{ feedbackLabelStyle }}\">{{ feedbackLabel }}<\u002Fdiv>\n                <p style=\"font-size:.98rem;line-height:1.62;color:#2c2520;margin:0;\">{{ feedback }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isReveal }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:fadeUp .4s ease;\">\n            <div style=\"font-family:'Fira Code',monospace;font-size:.72rem;letter-spacing:2.5px;text-transform:uppercase;color:#c2185b;margin-bottom:14px;\">La soluzione<\u002Fdiv>\n            <h1 style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.14;margin:0 0 14px;color:#2c2520;\">Tre righe e abbiamo <em style=\"font-style:italic;color:#c2185b;\">finito<\u002Fem><\u002Fh1>\n            <p style=\"font-size:1.04rem;line-height:1.7;color:#5a524a;margin:0;\">Ora è pura meccanica: i principi di equivalenza fanno il lavoro al posto nostro.<\u002Fp>\n\n            <div style=\"background:#fff;border:1px solid #e4ddd4;border-radius:10px;padding:6px 12px;margin:24px 0;\">\n              <div style=\"display:flex;align-items:center;gap:18px;padding:13px 8px;border-bottom:1px solid #ece7de;animation:fadeUp .5s ease both;animation-delay:.04s;\">\n                <div style=\"flex:none;width:240px;font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.8px;text-transform:uppercase;color:#6e6760;\">Il modello<\u002Fdiv>\n                <div style=\"font-family:Georgia,serif;font-style:italic;font-size:1.5rem;color:#2c2520;\">5x = 36 + 2x<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:18px;padding:13px 8px;border-bottom:1px solid #ece7de;animation:fadeUp .5s ease both;animation-delay:.10s;\">\n                <div style=\"flex:none;width:240px;font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.8px;text-transform:uppercase;color:#6e6760;\">Porto le x a sinistra (cambia segno)<\u002Fdiv>\n                <div style=\"font-family:Georgia,serif;font-style:italic;font-size:1.5rem;color:#2c2520;\">5x − 2x = 36<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:18px;padding:13px 8px;border-bottom:1px solid #ece7de;animation:fadeUp .5s ease both;animation-delay:.16s;\">\n                <div style=\"flex:none;width:240px;font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.8px;text-transform:uppercase;color:#6e6760;\">Raccolgo i termini simili<\u002Fdiv>\n                <div style=\"font-family:Georgia,serif;font-style:italic;font-size:1.5rem;color:#2c2520;\">3x = 36<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:18px;padding:13px 8px;border-bottom:1px solid #ece7de;animation:fadeUp .5s ease both;animation-delay:.22s;\">\n                <div style=\"flex:none;width:240px;font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.8px;text-transform:uppercase;color:#6e6760;\">Divido per 3, il coefficiente di x<\u002Fdiv>\n                <div style=\"font-family:Georgia,serif;font-style:italic;font-size:1.5rem;color:#2c2520;\">x = 36 : 3<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:18px;padding:18px 8px;animation:fadeUp .5s ease both;animation-delay:.30s;\">\n                <div style=\"flex:none;width:240px;font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.8px;text-transform:uppercase;color:#4a7c59;font-weight:700;\">Soluzione<\u002Fdiv>\n                <div style=\"font-family:Georgia,serif;font-style:italic;font-size:2.2rem;color:#4a7c59;font-weight:600;\">x = 12<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <p style=\"font-size:1.04rem;line-height:1.72;color:#5a524a;margin:0;\">Dodici. Ma dodici <em style=\"font-style:italic\">cosa<\u002Fem>? Un numero da solo non risolve niente: va riportato al mondo da cui è partito.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isFinal }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:fadeUp .4s ease;\">\n            <div style=\"font-family:'Fira Code',monospace;font-size:.72rem;letter-spacing:2.5px;text-transform:uppercase;color:#c2185b;margin-bottom:14px;\">Verifica e morale<\u002Fdiv>\n            <h1 style=\"font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.14;margin:0 0 22px;color:#2c2520;\">Dal problema alla <em style=\"font-style:italic;color:#c2185b;\">decisione<\u002Fem><\u002Fh1>\n\n            <div style=\"background:rgba(74,124,89,.07);border-left:2px solid #4a7c59;padding:16px 20px;border-radius:0 8px 8px 0;margin-bottom:24px;\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:1.5px;text-transform:uppercase;color:#4a7c59;font-weight:700;margin-bottom:8px;\">Verifica a x = 12<\u002Fdiv>\n              <p style=\"font-size:1rem;line-height:1.7;color:#2c2520;margin:0;\">LIBERA → <em style=\"font-style:italic\">5 · 12 = 60 €<\u002Fem>. &nbsp; SMART → <em style=\"font-style:italic\">36 + 2 · 12 = 36 + 24 = 60 €<\u002Fem>. &nbsp; Stesso costo: il modello regge. ✓<\u002Fp>\n            <\u002Fdiv>\n\n            <p style=\"font-size:1.05rem;line-height:1.75;color:#5a524a;margin:0 0 16px;\">L'abbonamento SMART è una scommessa sulla versione disciplinata di te stesso. L'equazione non ti dice chi sei — ti dice soltanto a quale soglia quella scommessa comincia a pagare. Per Bruno, oggi, quella soglia (12 ingressi al mese, tre volte a settimana) è molto lontana.<\u002Fp>\n            <p style=\"font-family:'Playfair Display',serif;font-style:italic;font-size:1.3rem;line-height:1.55;color:#2c2520;margin:24px 0 0;\">Modellare è questo: trasformare una scelta confusa in tre righe che decidono al posto tuo.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:44px;padding-top:22px;border-top:1px solid #ece7de;\">\n          <button onclick=\"{{ back }}\" style=\"{{ backStyle }}\">← Indietro<\u002Fbutton>\n          <button onclick=\"{{ primaryAction }}\" style=\"{{ primaryStyle }}\">{{ primaryLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showAside }}\" hint-placeholder-val=\"{{ false }}\">\n        <aside style=\"position:sticky;top:88px;display:flex;flex-direction:column;gap:16px;\">\n          <div style=\"background:#fff;border:1px solid #e4ddd4;border-radius:10px;padding:16px 18px;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:1.4px;text-transform:uppercase;color:#6e6760;font-weight:600;margin-bottom:12px;\">Le due tariffe<\u002Fdiv>\n            <div style=\"font-size:.9rem;color:#2c2520;line-height:1.5;margin-bottom:10px;\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:1px;color:#c2185b;font-weight:700;\">LIBERA<\u002Fspan><br>5 € a ingresso\n            <\u002Fdiv>\n            <div style=\"font-size:.9rem;color:#2c2520;line-height:1.5;\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:1px;color:#3a6b8c;font-weight:700;\">SMART<\u002Fspan><br>36 €/mese + 2 € a ingresso\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#f5f0e8;border:1px solid #e4ddd4;border-radius:10px;padding:18px;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:1.6px;text-transform:uppercase;color:#c2185b;font-weight:700;margin-bottom:14px;\">Il modello finora<\u002Fdiv>\n            <sc-if value=\"{{ hasModel }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:13px;\">\n                <sc-for list=\"{{ model }}\" as=\"m\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;flex-direction:column;gap:3px;\">\n                    <div style=\"font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:1.2px;text-transform:uppercase;color:#6e6760;\">{{ m.label }}<\u002Fdiv>\n                    <div style=\"{{ m.valStyle }}\">{{ m.val }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noModel }}\" hint-placeholder-val=\"{{ true }}\">\n              <p style=\"font-family:'Fira Code',monospace;font-size:.8rem;color:#8a8078;margin:0;line-height:1.55;\">Si costruisce passo dopo passo, con le tue risposte.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Faside>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.state = { i:0, maxI:0, ans:{} };\n    this._screens = this.buildScreens();\n  }\n\n  buildScreens(){\n    return [\n      { view:'intro' },\n      { view:'problem' },\n      { view:'choice', key:'incognita', tag:'Passo 1 · Modellare',\n        q:'Da dove si comincia: chi è la nostra incognita x?',\n        hint:'L’incognita è ciò che NON conosciamo e vogliamo trovare. Tutto il resto sono dati.',\n        formula:false,\n        options:[\n          {l:'Il numero di ingressi in palestra in un mese', ok:true,  fb:'Esatto. I prezzi (5 €, 36 €, 2 €) li conosciamo già: l’unica cosa che fa cambiare il conto è quante volte Bruno entra. Quello è x.'},\n          {l:'Il costo totale che Bruno pagherà',            ok:false, fb:'È ciò che vogliamo confrontare, ma dipende da un’altra quantità. L’incognita di partenza è proprio quella quantità.'},\n          {l:'Il prezzo di un singolo ingresso',            ok:false, fb:'Quello è un dato noto (5 € oppure 2 €), non un’incognita da trovare.'},\n          {l:'Il numero di mesi di abbonamento',            ok:false, fb:'Il confronto avviene dentro un solo mese: il mese non è la variabile.'},\n        ],\n        commit:{label:'Incognita', val:'x = ingressi in un mese', formula:false}\n      },\n      { view:'choice', key:'libera', tag:'Passo 1 · Modellare',\n        q:'Con la tariffa LIBERA paghi 5 € ogni volta che entri. Se entri x volte in un mese, quanto spendi?',\n        hint:'5 euro che si ripetono ad ogni ingresso.',\n        formula:true,\n        options:[\n          {l:'5x',    ok:true,  fb:'Sì: 5 € ripetuti x volte è una moltiplicazione → 5 · x = 5x.'},\n          {l:'5 + x', ok:false, fb:'Sarebbe “5 più gli ingressi”. Ma qui ogni ingresso costa 5 €: è un prodotto, non una somma.'},\n          {l:'x : 5', ok:false, fb:'La divisione non c’entra: ogni ingresso aggiunge 5 €, quindi si moltiplica.'},\n          {l:'5',     ok:false, fb:'5 è il costo di un solo ingresso. Con x ingressi diventa 5 per x.'},\n        ],\n        commit:{label:'Costo LIBERA', val:'5x', formula:true}\n      },\n      { view:'choice', key:'smart', tag:'Passo 1 · Modellare',\n        q:'Con la tariffa SMART paghi 36 € fissi al mese, più 2 € per ogni ingresso. Spesa totale con x ingressi?',\n        hint:'Una parte è fissa, una parte cresce con gli ingressi.',\n        formula:true,\n        options:[\n          {l:'36 + 2x', ok:true,  fb:'Esatto: i 36 € fissi non dipendono dagli ingressi; i 2 € invece si ripetono x volte → 36 + 2x.'},\n          {l:'36x + 2', ok:false, fb:'Ruoli scambiati: i 36 € sono fissi (non per ingresso), i 2 € sono quelli da pagare ad ogni ingresso.'},\n          {l:'38x',     ok:false, fb:'Non puoi sommare 36 e 2: uno è fisso, l’altro è “per ingresso”. Sono grandezze diverse.'},\n          {l:'36 + 2',  ok:false, fb:'Hai dimenticato gli ingressi: i 2 € vanno moltiplicati per x.'},\n        ],\n        commit:{label:'Costo SMART', val:'36 + 2x', formula:true}\n      },\n      { view:'choice', key:'equazione', tag:'Passo 2 · Scrivere l’equazione',\n        q:'Cerchiamo il punto in cui le due tariffe costano uguale. Come si scrive “lo stesso costo”?',\n        hint:'“Costano uguale” è un’uguaglianza fra le due spese.',\n        formula:true,\n        options:[\n          {l:'5x = 36 + 2x',      ok:true,  fb:'Perfetto. “Costano uguale” significa mettere un = fra le due spese. Ecco il modello completo del problema.'},\n          {l:'5x = 36 − 2x',      ok:false, fb:'Il costo SMART è 36 + 2x: il costo degli ingressi si somma alla quota fissa, non si sottrae.'},\n          {l:'5x + 36 + 2x = 0',  ok:false, fb:'Non cerchiamo “quando il costo è zero”, ma “quando i due costi sono uguali fra loro”.'},\n          {l:'5x > 36 + 2x',      ok:false, fb:'Il simbolo > risponde a “quando costa di più”. Per il pareggio serve l’uguale.'},\n        ],\n        commit:{label:'Equazione', val:'5x = 36 + 2x', formula:true}\n      },\n      { view:'choice', key:'primopasso', tag:'Passo 3 · Risolvere',\n        q:'Abbiamo 5x = 36 + 2x. Per isolare la x, qual è una prima mossa corretta?',\n        hint:'Obiettivo: radunare le x da una parte e i numeri dall’altra.',\n        formula:false,\n        options:[\n          {l:'Porto i 2x a sinistra: diventa 5x − 2x = 36',        ok:true,  fb:'Bene: un termine che cambia membro cambia segno. Le x finiscono da una parte, i numeri dall’altra.'},\n          {l:'Aggiungo 2x a sinistra senza toccare il lato destro', ok:false, fb:'Così rompi l’equilibrio della bilancia: ciò che fai a un membro va fatto anche all’altro.'},\n          {l:'Divido subito tutto per 5',                           ok:false, fb:'Troppo presto: a destra c’è ancora un 2x. Prima si radunano le x da una sola parte.'},\n        ],\n        commit:null\n      },\n      { view:'reveal' },\n      { view:'choice', key:'interpreta', tag:'Passo 4 · Interpretare',\n        q:'Abbiamo trovato x = 12. Che cosa significa, nel mondo di Bruno?',\n        hint:'Un numero da solo non risolve un problema: va riportato alle parole di partenza.',\n        formula:false,\n        options:[\n          {l:'A 12 ingressi al mese le due tariffe costano esattamente uguale (60 € entrambe)', ok:true,  fb:'Esatto. x = 12 è il punto di pareggio: la soglia che decide quale tariffa conviene.'},\n          {l:'Bruno è obbligato ad andare in palestra 12 volte',                                ok:false, fb:'L’equazione non obbliga nessuno: dice solo dove i due prezzi si incontrano.'},\n          {l:'Ogni ingresso costa 12 €',                                                        ok:false, fb:'No: 12 è un numero di ingressi, non un prezzo. Il costo di pareggio è 60 €.'},\n          {l:'La tariffa SMART costa sempre 12 €',                                              ok:false, fb:'12 non è un costo: è il numero di ingressi in cui le due tariffe pareggiano.'},\n        ],\n        commit:null\n      },\n      { view:'choice', key:'decisione', tag:'Passo 5 · Decidere',\n        q:'Negli ultimi tre anni Bruno è andato in palestra in media 5 volte… a gennaio, poi più niente. Sotto i 12 ingressi conviene LIBERA, sopra conviene SMART. Cosa gli conviene davvero?',\n        hint:'Confronta i 5 ingressi realistici con la soglia di pareggio di 12.',\n        formula:false,\n        options:[\n          {l:'La tariffa LIBERA',                  ok:true,  fb:'Giusto. A 5 ingressi: LIBERA = 25 €, SMART = 46 €. Risparmia 21 € — e non scommette su un Bruno disciplinato che la storia non ha mai visto.'},\n          {l:'La tariffa SMART',                   ok:false, fb:'SMART conviene solo SOPRA i 12 ingressi al mese (tre volte a settimana, ogni settimana). A 5 ingressi Bruno paga 46 € invece di 25 €.'},\n          {l:'Sono indifferenti, tanto è uguale',  ok:false, fb:'Uguali lo sono solo a 12 ingressi. A 5 c’è una bella differenza: 25 € contro 46 €.'},\n        ],\n        commit:{label:'Decisione', val:'Conviene la tariffa LIBERA', formula:false}\n      },\n      { view:'final' },\n    ];\n  }\n\n  valStyle(formula, hi){\n    if(hi) return 'font-family:Georgia,serif;font-style:italic;font-size:1.25rem;color:#4a7c59;font-weight:600;';\n    if(formula) return 'font-family:Georgia,serif;font-style:italic;font-size:1.15rem;color:#2c2520;';\n    return 'font-size:.96rem;color:#2c2520;line-height:1.4;';\n  }\n\n  choose(idx){\n    const i = this.state.i;\n    const cur = this._screens[i];\n    const a = this.state.ans[i] || {picked:null, solved:false};\n    if(a.solved) return;\n    const ok = cur.options[idx].ok;\n    this.setState({ ans: { ...this.state.ans, [i]: { picked:idx, solved:ok } } });\n  }\n\n  next(){\n    const ni = Math.min(this.state.i + 1, this._screens.length - 1);\n    this.setState({ i:ni, maxI: Math.max(this.state.maxI, ni) });\n    window.scrollTo({ top:0, behavior:'smooth' });\n  }\n  back(){\n    const ni = Math.max(this.state.i - 1, 0);\n    this.setState({ i:ni });\n    window.scrollTo({ top:0, behavior:'smooth' });\n  }\n  restart(){\n    this.setState({ i:0, maxI:0, ans:{} });\n    window.scrollTo({ top:0, behavior:'smooth' });\n  }\n\n  componentDidMount(){\n    this._key = (e) => {\n      if(e.key === 'ArrowLeft'){ this.back(); return; }\n      if(e.key === 'ArrowRight' || e.key === 'Enter'){\n        const i = this.state.i;\n        const cur = this._screens[i];\n        const a = this.state.ans[i] || {};\n        if(cur.view === 'final'){ return; }\n        if(cur.view !== 'choice' || a.solved){ this.next(); }\n      }\n    };\n    window.addEventListener('keydown', this._key);\n  }\n  componentWillUnmount(){ window.removeEventListener('keydown', this._key); }\n\n  renderVals(){\n    const S = this._screens;\n    const i = this.state.i;\n    const cur = S[i];\n    const total = S.length;\n    const ans = this.state.ans;\n    const a = ans[i] || { picked:null, solved:false };\n    const view = cur.view;\n    const isChoice = view === 'choice';\n\n    let correctIdx = -1;\n    let opts = [];\n    if(isChoice){\n      cur.options.forEach((o, idx) => { if(o.ok) correctIdx = idx; });\n      opts = cur.options.map((o, idx) => {\n        const solved = a.solved;\n        const isCorrect = idx === correctIdx;\n        const picked = a.picked === idx;\n        let card = 'display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid #e4ddd4;border-radius:9px;padding:15px 18px;cursor:pointer;transition:all .16s;color:#2c2520;';\n        let letterBg = '#f5f0e8', letterColor = '#6e6760', icon = '', iconColor = '#b33a3a';\n        if(solved && isCorrect){\n          card = 'display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:rgba(74,124,89,.09);border:1.5px solid #4a7c59;border-radius:9px;padding:14.5px 17.5px;transition:all .16s;color:#2c2520;cursor:default;';\n          letterBg = '#4a7c59'; letterColor = '#fff'; icon = '✓'; iconColor = '#4a7c59';\n        } else if(solved && !isCorrect){\n          card += 'opacity:.4;cursor:default;';\n        } else if(!solved && picked){\n          card = 'display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:rgba(179,58,58,.07);border:1.5px solid #b33a3a;border-radius:9px;padding:14.5px 17.5px;cursor:pointer;transition:all .16s;color:#2c2520;';\n          letterBg = '#b33a3a'; letterColor = '#fff'; icon = '✗'; iconColor = '#b33a3a';\n        }\n        const labelStyle = cur.formula\n          ? 'flex:1;font-family:Georgia,serif;font-style:italic;font-size:1.4rem;letter-spacing:.5px;'\n          : 'flex:1;font-size:1.02rem;line-height:1.5;';\n        return {\n          idx, label:o.l,\n          card, labelStyle,\n          letter: String.fromCharCode(65 + idx),\n          letterStyle: 'flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:\\'JetBrains Mono\\',monospace;font-size:.78rem;font-weight:700;background:' + letterBg + ';color:' + letterColor + ';',\n          icon,\n          iconStyle: 'flex:none;width:18px;text-align:center;font-size:1.05rem;font-weight:700;color:' + iconColor + ';',\n          onClick: () => this.choose(idx),\n        };\n      });\n    }\n\n    let feedback = null, feedbackOk = false, feedbackLabel = '';\n    if(isChoice && a.picked != null){\n      if(a.solved){ feedback = cur.options[correctIdx].fb; feedbackOk = true; feedbackLabel = 'Corretto'; }\n      else { feedback = cur.options[a.picked].fb; feedbackOk = false; feedbackLabel = 'Riprova'; }\n    }\n\n    const dots = S.map((s, k) => {\n      const bg = k === i ? '#c2185b' : (k < i ? '#c9b8a8' : '#e4ddd4');\n      const w = k === i ? '26px' : '16px';\n      return { style: 'flex:none;width:' + w + ';height:4px;border-radius:2px;background:' + bg + ';transition:all .25s;' };\n    });\n\n    const solved = k => ans[k] && ans[k].solved;\n    const model = [];\n    if(solved(2)) model.push({ label:'Incognita',    val:'x = ingressi in un mese',     valStyle:this.valStyle(false,false) });\n    if(solved(3)) model.push({ label:'Costo LIBERA',  val:'5x',                          valStyle:this.valStyle(true,false) });\n    if(solved(4)) model.push({ label:'Costo SMART',   val:'36 + 2x',                     valStyle:this.valStyle(true,false) });\n    if(solved(5)) model.push({ label:'Equazione',     val:'5x = 36 + 2x',                valStyle:this.valStyle(true,false) });\n    if(this.state.maxI >= 7) model.push({ label:'Soluzione', val:'x = 12',               valStyle:this.valStyle(true,true) });\n    if(solved(9)) model.push({ label:'Decisione',     val:'Conviene la tariffa LIBERA',  valStyle:this.valStyle(false,false) });\n\n    const showAside = !(view === 'intro' || view === 'problem');\n    const canAdvance = !isChoice || a.solved;\n    const isFinal = view === 'final';\n\n    const labels = { intro:'Comincia →', problem:'Costruiamo il modello →', reveal:'Interpretiamo →', final:'Ricomincia ↺' };\n    let primaryLabel = labels[view] || 'Continua →';\n    if(isChoice && !a.solved) primaryLabel = 'Scegli una risposta';\n\n    return {\n      view,\n      isIntro: view === 'intro', isProblem: view === 'problem',\n      isChoice, isReveal: view === 'reveal', isFinal,\n      tag: cur.tag || '', q: cur.q || '', hint: cur.hint || '',\n      opts,\n      feedback, feedbackOk, feedbackLabel,\n      feedbackStyle: 'background:' + (feedbackOk ? 'rgba(74,124,89,.08)' : 'rgba(179,58,58,.06)') + ';border-left:2px solid ' + (feedbackOk ? '#4a7c59' : '#b33a3a') + ';padding:14px 18px;border-radius:0 8px 8px 0;margin-top:20px;animation:fadeUp .3s ease;',\n      feedbackLabelStyle: 'font-family:\\'JetBrains Mono\\',monospace;font-size:.62rem;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-bottom:6px;color:' + (feedbackOk ? '#4a7c59' : '#b33a3a') + ';',\n      dots, counter: (i + 1) + ' / ' + total,\n      model, hasModel: model.length > 0, noModel: model.length === 0,\n      showAside,\n      gridStyle: showAside ? 'display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:42px;align-items:start;' : 'max-width:680px;margin:0 auto;',\n      canAdvance,\n      primaryLabel,\n      primaryStyle: canAdvance\n        ? 'font-family:\\'JetBrains Mono\\',monospace;font-size:.82rem;letter-spacing:.5px;background:#c2185b;color:#fff;border:none;border-radius:8px;padding:13px 26px;cursor:pointer;transition:all .18s;'\n        : 'font-family:\\'JetBrains Mono\\',monospace;font-size:.82rem;letter-spacing:.5px;background:#ece7de;color:#a89c8e;border:none;border-radius:8px;padding:13px 26px;cursor:not-allowed;',\n      primaryAction: isFinal ? (() => this.restart()) : (canAdvance ? (() => this.next()) : (() => {})),\n      backDisabled: i === 0,\n      backStyle: 'font-family:\\'JetBrains Mono\\',monospace;font-size:.82rem;background:none;border:none;color:' + (i === 0 ? '#cfc6ba' : '#5a524a') + ';cursor:' + (i === 0 ? 'default' : 'pointer') + ';padding:6px 2px;',\n      back: () => this.back(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
