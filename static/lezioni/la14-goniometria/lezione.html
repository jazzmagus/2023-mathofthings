<script>
function acc(items) {
  return '<div class="accordion">' + items.map((it, i) =>
    '<div class="acc-item">' +
      '<div class="acc-header" onclick="toggleAcc(this)">' +
        '<div class="acc-num">' + (i + 1) + '</div>' +
        '<div class="acc-title">' + it.t + '</div>' +
        '<svg class="acc-arrow" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
      '</div>' +
      '<div class="acc-body"><div class="acc-inner">' + it.h + '</div></div>' +
    '</div>'
  ).join('') + '</div>';
}

function toggleAcc(el) {
  const item = el.parentElement;
  item.classList.toggle('open');
  if (item.classList.contains('open') && typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([item]);
  }
}

/* ── Grafici delle funzioni goniometriche ── */
const PI = Math.PI;

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function drawFnCurve(svg, fn, xMin, xMax, yMin, yMax, xs, ys, color) {
  const steps = 800;
  let d = '';
  let started = false;
  for (let i = 0; i <= steps; i++) {
    const x = xMin + ((xMax - xMin) * i) / steps;
    const y = fn(x);
    if (!isFinite(y) || Math.abs(y) > yMax * 1.25) { started = false; continue; }
    const px = xs(x).toFixed(1), py = ys(y).toFixed(1);
    d += (started ? 'L' : 'M') + px + ' ' + py + ' ';
    started = true;
  }
  svg.appendChild(svgEl('path', { class: 'fn-curve', stroke: color, d }));
}

function drawGrid(svg, xMin, xMax, yMin, yMax, xs, ys, xTicks) {
  const L = xs(xMin), R = xs(xMax), T = ys(yMax), B = ys(yMin);
  xTicks.forEach((t) => {
    svg.appendChild(svgEl('line', { class: 'grid-line', x1: xs(t.v), y1: T, x2: xs(t.v), y2: B }));
    const lbl = svgEl('text', { class: 'graph-label', x: xs(t.v), y: ys(0) + 22, 'text-anchor': 'middle' });
    lbl.textContent = t.label;
    svg.appendChild(lbl);
  });
  svg.appendChild(svgEl('line', { class: 'axis-line', x1: L, y1: ys(0), x2: R, y2: ys(0) }));
  svg.appendChild(svgEl('line', { class: 'axis-line', x1: xs(0), y1: T, x2: xs(0), y2: B }));
}

function drawSinCosGraph(svgId) {
  const svg = document.getElementById(svgId);
  if (!svg) return;
  svg.innerHTML = '';
  const xMin = -2 * PI, xMax = 2 * PI, yMin = -1.4, yMax = 1.4;
  const L = 55, R = 845, T = 25, B = 340;
  const xs = (v) => L + ((v - xMin) / (xMax - xMin)) * (R - L);
  const ys = (v) => B - ((v - yMin) / (yMax - yMin)) * (B - T);
  const xTicks = [
    { v: -2 * PI, label: '-2π' }, { v: -PI, label: '-π' }, { v: 0, label: '0' },
    { v: PI, label: 'π' }, { v: 2 * PI, label: '2π' },
  ];
  drawGrid(svg, xMin, xMax, yMin, yMax, xs, ys, xTicks);
  [-1, 1].forEach((v) => {
    const lbl = svgEl('text', { class: 'graph-label', x: xs(xMin) - 6, y: ys(v) + 4, 'text-anchor': 'end' });
    lbl.textContent = v;
    svg.appendChild(lbl);
  });
  drawFnCurve(svg, Math.sin, xMin, xMax, yMin, yMax, xs, ys, 'var(--accent)');
  drawFnCurve(svg, Math.cos, xMin, xMax, yMin, yMax, xs, ys, 'var(--blue)');
  const leg1 = svgEl('text', { class: 'graph-legend', x: R - 90, y: T + 16, fill: 'var(--accent)' });
  leg1.textContent = 'sin x';
  svg.appendChild(leg1);
  const leg2 = svgEl('text', { class: 'graph-legend', x: R - 30, y: T + 16, fill: 'var(--blue)' });
  leg2.textContent = 'cos x';
  svg.appendChild(leg2);
}

function drawTanGraph(svgId) {
  const svg = document.getElementById(svgId);
  if (!svg) return;
  svg.innerHTML = '';
  const xMin = -1.5 * PI, xMax = 1.5 * PI, yMin = -4, yMax = 4;
  const L = 55, R = 845, T = 25, B = 340;
  const xs = (v) => L + ((v - xMin) / (xMax - xMin)) * (R - L);
  const ys = (v) => B - ((v - yMin) / (yMax - yMin)) * (B - T);
  const xTicks = [
    { v: -PI, label: '-π' }, { v: -0.5 * PI, label: '-π/2' }, { v: 0, label: '0' },
    { v: 0.5 * PI, label: 'π/2' }, { v: PI, label: 'π' },
  ];
  drawGrid(svg, xMin, xMax, yMin, yMax, xs, ys, xTicks);
  [-1.5 * PI, -0.5 * PI, 0.5 * PI, 1.5 * PI].forEach((a) => {
    svg.appendChild(svgEl('line', { class: 'graph-asymptote', x1: xs(a), y1: T, x2: xs(a), y2: B }));
  });
  drawFnCurve(svg, Math.tan, xMin, xMax, yMin, yMax, xs, ys, 'var(--accent)');
}

function drawLessonGraphs() {
  drawSinCosGraph('laGraphSinCos');
  drawTanGraph('laGraphTan');
}

const S = [
{
  tag:"FONDAMENTI",
  title:"Radianti e <em>circonferenza goniometrica</em>",
  nav:"Fondamenti",
  body:
    '<p>Un angolo si può misurare in gradi, ma in matematica conviene una misura legata direttamente alla geometria della circonferenza: il <strong>radiante</strong>.</p>' +
    '<div class="cb"><div class="cb-label">Definizione — radiante</div><p>Un angolo misura \\(1\\) radiante quando l\'arco di circonferenza che sottende ha lunghezza uguale al raggio.</p></div>' +
    '<p>Poiché la lunghezza di una circonferenza di raggio \\(r\\) è \\(2\\pi r\\), l\'angolo giro misura \\(2\\pi\\) radianti indipendentemente da \\(r\\): il radiante è un rapporto tra lunghezze, quindi un numero puro.</p>' +
    '<div class="math-block hero-formula">\\[ 180^\\circ = \\pi \\ \\text{rad} \\qquad\\Longrightarrow\\qquad x_{\\text{rad}} = x_{\\text{gradi}}\\cdot\\frac{\\pi}{180} \\]</div>' +
    '<div class="cb tip"><div class="cb-label">Circonferenza goniometrica</div><p>È la circonferenza di raggio \\(1\\) centrata nell\'origine: \\(x^2+y^2=1\\). Dato un angolo \\(x\\), si individua un unico punto \\(P\\) percorrendo la circonferenza a partire da \\((1,0)\\) (antiorario se \\(x>0\\)). Ma più angoli — che differiscono per multipli di \\(2\\pi\\) — danno lo stesso punto \\(P\\): è la radice della periodicità.</p></div>' +
    acc([
      { t:"Esercizio — conversione gradi/radianti", h:'<p>Converti \\(150^\\circ\\) in radianti e \\(\\dfrac{5\\pi}{4}\\) in gradi.</p><div class="math-block result">\\[ 150^\\circ \\cdot \\frac{\\pi}{180} = \\frac{5\\pi}{6} \\ \\text{rad} \\qquad\\qquad \\frac{5\\pi}{4}\\cdot\\frac{180}{\\pi} = 225^\\circ \\]</div>' }
    ])
},
{
  tag:"DEFINIZIONI",
  title:"Seno, coseno e <em>tangente</em>",
  nav:"Definizioni",
  body:
    '<p>Dato l\'angolo \\(x\\) e il punto \\(P=(x_P,y_P)\\) corrispondente sulla circonferenza goniometrica, si definisce:</p>' +
    '<div class="cb"><div class="cb-label">Definizione</div><div class="math-block hero-formula">\\[ \\cos x = x_P \\qquad \\sin x = y_P \\qquad \\tan x = \\frac{\\sin x}{\\cos x}\\ \\ (\\cos x\\neq 0) \\]</div></div>' +
    '<p>Questa definizione, a differenza di quella "cateto su ipotenusa" del triangolo rettangolo, funziona per <strong>qualunque</strong> angolo reale, e permette di trattare seno e coseno come vere funzioni definite su tutto \\(\\mathbb{R}\\).</p>' +
    '<table class="ct center"><tr><th></th><th>Dominio</th><th>Codominio</th><th>Periodo</th></tr>' +
    '<tr><td>\\(\\sin x\\)</td><td>\\(\\mathbb{R}\\)</td><td>\\([-1,1]\\)</td><td>\\(2\\pi\\)</td></tr>' +
    '<tr><td>\\(\\cos x\\)</td><td>\\(\\mathbb{R}\\)</td><td>\\([-1,1]\\)</td><td>\\(2\\pi\\)</td></tr>' +
    '<tr><td>\\(\\tan x\\)</td><td>\\(\\mathbb{R}\\setminus\\{\\frac{\\pi}{2}+k\\pi\\}\\)</td><td>\\(\\mathbb{R}\\)</td><td>\\(\\pi\\)</td></tr></table>' +
    '<div class="graph-wrap"><svg id="laGraphSinCos" viewBox="0 0 900 400"></svg></div>' +
    '<p style="font-size:.85rem;" class="dim">In rosa \\(\\sin x\\), in blu \\(\\cos x\\): stessa forma, sfasate di \\(\\pi/2\\).</p>' +
    '<div class="cb warn"><div class="cb-label">Identità fondamentale — dimostrazione</div><p>Poiché \\(P=(\\cos x,\\sin x)\\) appartiene sempre alla circonferenza \\(x^2+y^2=1\\), sostituendo le coordinate di \\(P\\) nell\'equazione della circonferenza si ottiene, per ogni \\(x\\):</p><div class="math-block result">\\[ \\sin^2 x + \\cos^2 x = 1 \\]</div><p>Non è un\'osservazione empirica: è una conseguenza diretta della definizione, valida sempre.</p></div>' +
    '<div class="cb tip"><div class="cb-label">Parità</div><p>Dalla simmetria della circonferenza rispetto all\'asse \\(x\\): \\(\\cos(-x)=\\cos x\\) (funzione <strong>pari</strong>), \\(\\sin(-x)=-\\sin x\\) e \\(\\tan(-x)=-\\tan x\\) (funzioni <strong>dispari</strong>).</p></div>' +
    '<p>La tangente, con il suo periodo dimezzato e i suoi asintoti, ha un grafico ben diverso:</p>' +
    '<div class="graph-wrap"><svg id="laGraphTan" viewBox="0 0 900 400"></svg></div>'
},
{
  tag:"ANGOLI NOTEVOLI",
  title:"Da dove vengono i valori <em>esatti</em>",
  nav:"Angoli notevoli",
  body:
    '<p>I valori di seno e coseno per \\(30^\\circ\\), \\(45^\\circ\\), \\(60^\\circ\\) non sono arbitrari: si ricavano dalla geometria di due triangoli notevoli.</p>' +
    '<h3>45° — la diagonale del quadrato</h3>' +
    '<p>Nel triangolo rettangolo isoscele con cateti \\(1\\), l\'ipotenusa è \\(\\sqrt{1^2+1^2}=\\sqrt2\\) (Pitagora). Gli angoli alla base sono entrambi \\(45^\\circ\\). Il rapporto cateto/ipotenusa dà:</p>' +
    '<div class="math-block result">\\[ \\sin\\frac{\\pi}{4} = \\cos\\frac{\\pi}{4} = \\frac{1}{\\sqrt2} = \\frac{\\sqrt2}{2} \\]</div>' +
    '<h3>60° e 30° — l\'altezza del triangolo equilatero</h3>' +
    '<p>In un triangolo equilatero di lato \\(2\\), l\'altezza lo divide in due triangoli rettangoli con ipotenusa \\(2\\), un cateto \\(1\\) (metà lato) e angoli \\(60^\\circ\\)-\\(30^\\circ\\). L\'altro cateto, per Pitagora, è \\(\\sqrt{4-1}=\\sqrt3\\):</p>' +
    '<div class="math-block result">\\[ \\sin\\frac{\\pi}{3}=\\cos\\frac{\\pi}{6}=\\frac{\\sqrt3}{2} \\qquad \\sin\\frac{\\pi}{6}=\\cos\\frac{\\pi}{3}=\\frac{1}{2} \\]</div>' +
    '<p>Da questi valori, con \\(\\tan x = \\sin x/\\cos x\\), si ricavano subito anche le tangenti.</p>' +
    '<table class="ct center"><tr><th>\\(x\\)</th><th>\\(0\\)</th><th>\\(\\pi/6\\)</th><th>\\(\\pi/4\\)</th><th>\\(\\pi/3\\)</th><th>\\(\\pi/2\\)</th></tr>' +
    '<tr><td>\\(\\sin x\\)</td><td>\\(0\\)</td><td>\\(\\frac12\\)</td><td>\\(\\frac{\\sqrt2}{2}\\)</td><td>\\(\\frac{\\sqrt3}{2}\\)</td><td>\\(1\\)</td></tr>' +
    '<tr><td>\\(\\cos x\\)</td><td>\\(1\\)</td><td>\\(\\frac{\\sqrt3}{2}\\)</td><td>\\(\\frac{\\sqrt2}{2}\\)</td><td>\\(\\frac12\\)</td><td>\\(0\\)</td></tr>' +
    '<tr><td>\\(\\tan x\\)</td><td>\\(0\\)</td><td>\\(\\frac{\\sqrt3}{3}\\)</td><td>\\(1\\)</td><td>\\(\\sqrt3\\)</td><td>n.e.</td></tr></table>' +
    '<p style="font-size:.85rem;" class="dim">Gli angoli del secondo, terzo e quarto quadrante si ottengono da questi per simmetria sulla circonferenza (angoli associati), senza bisogno di nuovi calcoli.</p>'
},
{
  tag:"DIMOSTRAZIONE",
  title:"Le formule di <em>addizione</em>",
  nav:"Addizione",
  body:
    '<p>Le formule più importanti della goniometria permettono di calcolare \\(\\sin(\\alpha\\pm\\beta)\\) e \\(\\cos(\\alpha\\pm\\beta)\\) a partire dai valori di \\(\\alpha\\) e \\(\\beta\\) separatamente. Le dimostriamo con la geometria della circonferenza goniometrica.</p>' +
    '<div class="cb"><div class="cb-label">Dimostrazione di cos(α−β)</div><p>Sulla circonferenza goniometrica, siano \\(A=(\\cos\\alpha,\\sin\\alpha)\\) e \\(B=(\\cos\\beta,\\sin\\beta)\\). La distanza \\(AB\\) si calcola in due modi.</p>' +
    '<p><strong>Modo 1 — formula della distanza:</strong></p><div class="math-block">\\[ AB^2 = (\\cos\\alpha-\\cos\\beta)^2 + (\\sin\\alpha-\\sin\\beta)^2 \\]</div>' +
    '<p>Sviluppando e usando \\(\\sin^2+\\cos^2=1\\) per \\(\\alpha\\) e per \\(\\beta\\):</p>' +
    '<div class="math-block">\\[ AB^2 = 2 - 2(\\cos\\alpha\\cos\\beta+\\sin\\alpha\\sin\\beta) \\]</div>' +
    '<p><strong>Modo 2 — teorema del coseno</strong> nel triangolo \\(OAB\\), con \\(OA=OB=1\\) e angolo al centro \\(\\alpha-\\beta\\):</p>' +
    '<div class="math-block">\\[ AB^2 = 1+1-2\\cos(\\alpha-\\beta) = 2-2\\cos(\\alpha-\\beta) \\]</div>' +
    '<p>Uguagliando le due espressioni di \\(AB^2\\):</p>' +
    '<div class="math-block result">\\[ \\cos(\\alpha-\\beta) = \\cos\\alpha\\cos\\beta+\\sin\\alpha\\sin\\beta \\]</div></div>' +
    '<div class="cb tip"><div class="cb-label">Le altre si ricavano da questa</div><p>Da \\(\\cos(\\alpha-\\beta)\\), sostituendo \\(\\beta \\to -\\beta\\) (e usando parità/disparità), si ottiene \\(\\cos(\\alpha+\\beta)\\). Da \\(\\sin x = \\cos(\\frac{\\pi}{2}-x)\\) si ricavano poi le formule per il seno.</p></div>' +
    '<table class="ct"><tr><th>Formula</th></tr>' +
    '<tr><td>\\(\\cos(\\alpha\\pm\\beta) = \\cos\\alpha\\cos\\beta \\mp \\sin\\alpha\\sin\\beta\\)</td></tr>' +
    '<tr><td>\\(\\sin(\\alpha\\pm\\beta) = \\sin\\alpha\\cos\\beta \\pm \\cos\\alpha\\sin\\beta\\)</td></tr>' +
    '<tr><td>\\(\\tan(\\alpha\\pm\\beta) = \\dfrac{\\tan\\alpha \\pm \\tan\\beta}{1 \\mp \\tan\\alpha\\tan\\beta}\\)</td></tr></table>' +
    acc([
      { t:"Esercizio — calcolare sin(75°) esattamente", h:'<p>Scrivi \\(75^\\circ = 45^\\circ + 30^\\circ\\) e applica la formula di addizione:</p><div class="math-block">\\[ \\sin75^\\circ = \\sin45^\\circ\\cos30^\\circ + \\cos45^\\circ\\sin30^\\circ = \\frac{\\sqrt2}{2}\\cdot\\frac{\\sqrt3}{2} + \\frac{\\sqrt2}{2}\\cdot\\frac12 \\]</div><div class="math-block result">\\[ \\sin75^\\circ = \\frac{\\sqrt6+\\sqrt2}{4} \\]</div>' }
    ])
},
{
  tag:"DIMOSTRAZIONE",
  title:"Duplicazione e <em>bisezione</em>",
  nav:"Duplicazione",
  body:
    '<p>Le formule di duplicazione sono un caso particolare delle formule di addizione: basta porre \\(\\beta=\\alpha\\).</p>' +
    '<div class="cb"><div class="cb-label">Dimostrazione — duplicazione</div><p>Da \\(\\sin(\\alpha+\\beta)=\\sin\\alpha\\cos\\beta+\\cos\\alpha\\sin\\beta\\), ponendo \\(\\beta=\\alpha\\):</p><div class="math-block result">\\[ \\sin(2\\alpha) = 2\\sin\\alpha\\cos\\alpha \\]</div><p>Analogamente da \\(\\cos(\\alpha+\\beta)=\\cos\\alpha\\cos\\beta-\\sin\\alpha\\sin\\beta\\):</p><div class="math-block result">\\[ \\cos(2\\alpha) = \\cos^2\\alpha - \\sin^2\\alpha \\]</div><p>Usando \\(\\sin^2\\alpha=1-\\cos^2\\alpha\\) (o viceversa), si ottengono le due forme equivalenti:</p><div class="math-block">\\[ \\cos(2\\alpha) = 2\\cos^2\\alpha - 1 = 1-2\\sin^2\\alpha \\]</div></div>' +
    '<h3>Bisezione: il percorso inverso</h3>' +
    '<p>Dalle due forme di \\(\\cos(2\\alpha)\\) appena viste, ricavando rispettivamente \\(\\sin^2\\alpha\\) e \\(\\cos^2\\alpha\\), e ponendo \\(\\alpha = x/2\\):</p>' +
    '<div class="cb"><div class="cb-label">Dimostrazione — bisezione</div><p>Da \\(\\cos x = 1-2\\sin^2\\frac{x}{2}\\):</p><div class="math-block">\\[ \\sin^2\\frac{x}{2} = \\frac{1-\\cos x}{2} \\quad\\Longrightarrow\\quad \\sin\\frac{x}{2} = \\pm\\sqrt{\\frac{1-\\cos x}{2}} \\]</div><p>Da \\(\\cos x = 2\\cos^2\\frac{x}{2}-1\\):</p><div class="math-block result">\\[ \\cos\\frac{x}{2} = \\pm\\sqrt{\\frac{1+\\cos x}{2}} \\]</div></div>' +
    '<div class="cb warn"><div class="cb-label">Il segno va scelto</div><p>Il segno \\(\\pm\\) non è ambiguità della formula: dipende dal <strong>quadrante</strong> in cui si trova \\(x/2\\), e va determinato caso per caso guardando dove cade l\'angolo dimezzato.</p></div>' +
    acc([
      { t:"Esercizio — cos(15°) con la bisezione", h:'<p>Scrivi \\(15^\\circ = \\dfrac{30^\\circ}{2}\\) e usa \\(\\cos30^\\circ=\\frac{\\sqrt3}{2}\\). Poiché \\(15^\\circ\\) è nel primo quadrante, il coseno è positivo:</p><div class="math-block result">\\[ \\cos15^\\circ = \\sqrt{\\frac{1+\\frac{\\sqrt3}{2}}{2}} = \\sqrt{\\frac{2+\\sqrt3}{4}} = \\frac{\\sqrt{2+\\sqrt3}}{2} \\]</div>' }
    ])
},
{
  tag:"OLTRE",
  title:"Le formule <em>parametriche</em>",
  nav:"Parametriche",
  body:
    '<p>Un\'ultima famiglia di formule esprime seno, coseno e tangente di \\(x\\) in funzione di un\'unica variabile \\(t = \\tan(x/2)\\): tornano utili per risolvere equazioni goniometriche che non rientrano negli schemi elementari.</p>' +
    '<div class="cb"><div class="cb-label">Dimostrazione</div><p>Partendo da \\(\\sin x = 2\\sin\\frac{x}{2}\\cos\\frac{x}{2}\\) (duplicazione) e dividendo numeratore e denominatore per \\(\\cos^2\\frac{x}{2}\\) (lecito se \\(\\cos\\frac x2\\neq0\\)):</p><div class="math-block">\\[ \\sin x = \\frac{2\\sin\\frac{x}{2}\\cos\\frac{x}{2}}{\\sin^2\\frac{x}{2}+\\cos^2\\frac{x}{2}} = \\frac{2\\tan\\frac{x}{2}}{1+\\tan^2\\frac{x}{2}} = \\frac{2t}{1+t^2} \\]</div><p>Con lo stesso procedimento su \\(\\cos x = \\cos^2\\frac x2 - \\sin^2\\frac x2\\):</p><div class="math-block result">\\[ \\cos x = \\frac{1-t^2}{1+t^2} \\qquad \\tan x = \\frac{2t}{1-t^2} \\]</div></div>' +
    '<div class="cb danger"><div class="cb-label">Attenzione al caso escluso</div><p>La sostituzione richiede \\(\\cos\\frac x2 \\neq 0\\), cioè esclude \\(x=\\pi+2k\\pi\\): quel valore va sempre controllato a parte quando si usano queste formule per risolvere un\'equazione.</p></div>'
},
{
  tag:"SINTESI",
  title:"Tutte le formule <em>insieme</em>",
  nav:"Sintesi",
  body:
    '<p>Ecco il quadro completo costruito in questa lezione: ogni formula discende dalla precedente, in una catena di dimostrazioni che parte dalla sola definizione di seno e coseno sulla circonferenza goniometrica.</p>' +
    '<table class="ct"><tr><th>Famiglia</th><th>Formula</th></tr>' +
    '<tr><td>Fondamentale</td><td>\\(\\sin^2x+\\cos^2x=1\\)</td></tr>' +
    '<tr><td>Addizione</td><td>\\(\\cos(\\alpha\\pm\\beta)=\\cos\\alpha\\cos\\beta\\mp\\sin\\alpha\\sin\\beta\\)</td></tr>' +
    '<tr><td></td><td>\\(\\sin(\\alpha\\pm\\beta)=\\sin\\alpha\\cos\\beta\\pm\\cos\\alpha\\sin\\beta\\)</td></tr>' +
    '<tr><td>Duplicazione</td><td>\\(\\sin2\\alpha=2\\sin\\alpha\\cos\\alpha,\\quad \\cos2\\alpha=\\cos^2\\alpha-\\sin^2\\alpha\\)</td></tr>' +
    '<tr><td>Bisezione</td><td>\\(\\sin\\frac x2=\\pm\\sqrt{\\frac{1-\\cos x}{2}},\\quad \\cos\\frac x2=\\pm\\sqrt{\\frac{1+\\cos x}{2}}\\)</td></tr>' +
    '<tr><td>Parametriche</td><td>\\(\\sin x=\\frac{2t}{1+t^2},\\quad \\cos x=\\frac{1-t^2}{1+t^2}\\ \\ (t=\\tan\\frac x2)\\)</td></tr></table>' +
    acc([
      { t:"Problema 1 — identità da dimostrare", h:'<p>Dimostra che \\(\\dfrac{\\sin2\\alpha}{1+\\cos2\\alpha} = \\tan\\alpha\\).</p><p><em>Traccia:</em> sostituisci \\(\\sin2\\alpha=2\\sin\\alpha\\cos\\alpha\\) e \\(1+\\cos2\\alpha=2\\cos^2\\alpha\\), poi semplifica.</p>' },
      { t:"Problema 2 — valore esatto con addizione", h:'<p>Calcola \\(\\cos105^\\circ\\) scrivendo \\(105^\\circ=60^\\circ+45^\\circ\\).</p><div class="math-block result">\\[ \\cos105^\\circ = \\frac{\\sqrt2-\\sqrt6}{4} \\]</div>' },
      { t:"Problema 3 — bisezione con scelta del segno", h:'<p>Calcola \\(\\sin\\dfrac{\\pi}{8}\\) sapendo che \\(\\dfrac{\\pi}{8}\\) è nel primo quadrante e \\(\\cos\\dfrac{\\pi}{4}=\\dfrac{\\sqrt2}{2}\\).</p><div class="math-block result">\\[ \\sin\\frac{\\pi}{8} = \\sqrt{\\frac{1-\\frac{\\sqrt2}{2}}{2}} = \\frac{\\sqrt{2-\\sqrt2}}{2} \\]</div>' }
    ]) +
    '<div class="cb purple"><div class="cb-label">Vai avanti</div><p>Con queste formule sei pronto per le <a href="/lezioni/equazioni-goniometriche/lezione.html">equazioni goniometriche</a> (LA15) — dove il metodo dell\'angolo aggiunto e le equazioni omogenee usano esattamente le formule dimostrate qui.</p></div>'
}
];

let currentIdx = 0;

function render() {
  const s = S[currentIdx];
  const html = '<div class="hero">' +
    '<div class="hero-tag">' + s.tag + '</div>' +
    '<h1>' + s.title + '</h1></div>' +
    '<div class="section-body">' + s.body + '</div>' +
    '<div class="bottom-nav">' +
    '<button class="bb" onclick="prev()" ' + (currentIdx === 0 ? 'disabled' : '') + '>← Indietro</button>' +
    '<div class="page-info">' + (currentIdx + 1) + ' / ' + S.length + '</div>' +
    '<button class="bb" onclick="next()" ' + (currentIdx === S.length - 1 ? 'disabled' : '') + '>Avanti →</button>' +
    '</div>';

  document.getElementById('app').innerHTML = html;
  drawLessonGraphs();

  const pills = S.map((s, i) =>
    '<button class="nav-pill ' + (i === currentIdx ? 'active' : '') + '" onclick="go(' + i + ')">' + s.nav + '</button>'
  ).join('');
  document.getElementById('topNav').innerHTML = pills;

  if (typeof MathJax !== 'undefined') {
    MathJax.typesetPromise([document.getElementById('app')]);
  }
  document.body.style.opacity = '1';
}

function prev() { if (currentIdx > 0) { currentIdx--; render(); window.scrollTo(0, 0); } }
function next() { if (currentIdx < S.length - 1) { currentIdx++; render(); window.scrollTo(0, 0); } }
function go(i) { currentIdx = i; render(); window.scrollTo(0, 0); }

render();
</script>
</body>
</html>
