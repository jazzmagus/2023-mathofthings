<script>
const sections = [
  {
    tag: 'FONDAMENTI',
    title: 'Definizione ed <em>equazioni elementari</em>',
    nav: 'Fondamenti',
    body: `
      <p class="section-intro">
        Un'<strong>equazione goniometrica</strong> è un'equazione in cui l'incognita compare come argomento di funzioni trigonometriche. A differenza delle equazioni algebriche ordinarie, hanno infinite soluzioni a causa della periodicità. Risolvere significa trovare tutti i valori di \\(x\\) in forma parametrica. Negli utilizzi pratici, modellano fenomeni ciclici: moti oscillatori, onde (suono, luce, radio), segnali (telecomunicazioni, acustica), circuiti AC, vibrazioni strutturali e moto rotazionale. Apprenderai a risolvere quattro tipi: elementari, riconducibili per sostituzione, lineari, e omogenee di secondo grado.
      </p>

      <div class="cb method">
        <div class="cb-label">Definizione</div>
        <p>Un'equazione si dice <strong>goniometrica</strong> se l'incognita compare nell'<strong>argomento</strong> di una funzione goniometrica.</p>
        <p style="margin-top:12px;"><strong>Equazioni elementari:</strong></p>
        <div class="math-block">
          \\[\\sin x = p, \\quad \\cos x = q, \\quad \\tan x = h, \\quad \\text{con } p, q, h \\in \\mathbb{R}\\]
        </div>
      </div>

      <h3>Formule di risoluzione</h3>

      <div class="cb tip">
        <div class="cb-label">Per seno</div>
        <div class="math-block">
          \\[\\sin x = m \\quad \\Rightarrow \\quad \\begin{cases} x = \\alpha + 2k\\pi \\\\ x = \\pi - \\alpha + 2k\\pi \\end{cases}, \\quad k \\in \\mathbb{Z}\\]
        </div>
        <p style="margin-top:12px;"><strong>Nota:</strong> \\(\\alpha\\) è il minore angolo positivo il cui seno vale \\(m\\).</p>
      </div>

      <div class="cb tip">
        <div class="cb-label">Per coseno</div>
        <div class="math-block">
          \\[\\cos x = m \\quad \\Rightarrow \\quad x = \\pm \\alpha + 2k\\pi, \\quad k \\in \\mathbb{Z}\\]
        </div>
      </div>

      <div class="cb tip">
        <div class="cb-label">Per tangente</div>
        <div class="math-block">
          \\[\\tan x = m \\quad \\Rightarrow \\quad x = \\alpha + k\\pi, \\quad k \\in \\mathbb{Z}\\]
        </div>
        <p style="margin-top:12px;"><strong>Nota:</strong> Il periodo è \\(\\pi\\), non \\(2\\pi\\)!</p>
      </div>

      <div class="cb success">
        <div class="cb-label">Esempio 1</div>
        <p><strong>Equazione:</strong></p>
        <div class="math-block">\\[\\cos x = \\frac{\\sqrt{3}}{2}\\]</div>
        <p style="margin-top:12px;"><strong>Risoluzione:</strong> L'angolo il cui coseno vale \\(\\dfrac{\\sqrt{3}}{2}\\) è \\(\\alpha = \\dfrac{\\pi}{6}\\).</p>
        <div class="math-block result">\\[x = \\pm \\frac{\\pi}{6} + 2k\\pi, \\quad k \\in \\mathbb{Z}\\]</div>
      </div>

      <div class="cb success">
        <div class="cb-label">Esempio 2</div>
        <p><strong>Equazione:</strong></p>
        <div class="math-block">\\[\\sin x = \\frac{1}{2}\\]</div>
        <p style="margin-top:12px;"><strong>Risoluzione:</strong> L'angolo il cui seno vale \\(\\dfrac{1}{2}\\) è \\(\\alpha = \\dfrac{\\pi}{6}\\).</p>
        <div class="math-block result">\\[\\begin{cases} x = \\dfrac{\\pi}{6} + 2k\\pi \\\\ x = \\pi - \\dfrac{\\pi}{6} + 2k\\pi = \\dfrac{5\\pi}{6} + 2k\\pi \\end{cases}, \\quad k \\in \\mathbb{Z}\\]</div>
      </div>
    `
  },

  {
    tag: 'CASO FREQUENTE',
    title: 'Equazioni <em>riconducibili</em> a elementari',
    nav: 'Riconducibili',
    body: `
      <p class="section-intro">Nella pratica raramente incontri equazioni già elementari. Imparerai a riconoscere le strategie per trasformarne di complesse in semplici: sono le stesse tecniche algebriche che usi per le equazioni polinomiali, solo applicate alle funzioni goniometriche.</p>

      <h3>Strategia: sostituzione</h3>

      <p>Se compare <strong>una sola funzione goniometrica</strong> con lo stesso argomento, usiamo una sostituzione.</p>

      <div class="cb success">
        <div class="cb-label">Esempio 1: Equazione di 2° grado in coseno</div>
        <p><strong>Equazione:</strong></p>
        <div class="math-block">\\[2\\cos^2 x - 3\\cos x + 1 = 0\\]</div>

        <div class="step-math"><div class="label">Passo 1</div>Poniamo \\(t = \\cos x\\)</div>
        <div class="math-block">\\[2t^2 - 3t + 1 = 0\\]</div>

        <div class="step-math"><div class="label">Passo 2</div>Risolviamo l'equazione di secondo grado</div>
        <div class="math-block">
          \\[t = \\frac{3 \\pm \\sqrt{9 - 8}}{4} = \\frac{3 \\pm 1}{4}\\]
        </div>
        <div class="math-block">\\[t_1 = 1, \\quad t_2 = \\frac{1}{2}\\]</div>

        <div class="step-math"><div class="label">Passo 3</div>Torniamo alla variabile \\(x\\)</div>
        <div class="math-block">
          \\[\\begin{cases}
            \\cos x = 1 \\Rightarrow x = 2k\\pi \\\\
            \\cos x = \\dfrac{1}{2} \\Rightarrow x = \\pm \\dfrac{\\pi}{3} + 2k\\pi
          \\end{cases}\\]
        </div>
      </div>

      <div class="cb success">
        <div class="cb-label">Esempio 2: Semplificazione con formule</div>
        <p><strong>Equazione:</strong></p>
        <div class="math-block">\\[2\\sin^2 x + \\sin(\\pi + x) - 1 = 0\\]</div>

        <div class="step-math"><div class="label">Passo 1</div>Usiamo la formula \\(\\sin(\\pi + x) = -\\sin x\\)</div>
        <div class="math-block">\\[2\\sin^2 x - \\sin x - 1 = 0\\]</div>

        <div class="step-math"><div class="label">Passo 2</div>Poniamo \\(t = \\sin x\\)</div>
        <div class="math-block">\\[2t^2 - t - 1 = 0 \\quad \\Rightarrow \\quad t_1 = 1, \\quad t_2 = -\\frac{1}{2}\\]</div>

        <div class="step-math"><div class="label">Passo 3</div>Torniamo alla variabile</div>
        <div class="math-block">
          \\[\\begin{cases}
            \\sin x = 1 \\Rightarrow x = \\dfrac{\\pi}{2} + 2k\\pi \\\\
            \\sin x = -\\dfrac{1}{2} \\Rightarrow x = -\\dfrac{\\pi}{6} + 2k\\pi \\text{ o } x = \\pi + \\dfrac{\\pi}{6} + 2k\\pi = \\dfrac{7\\pi}{6} + 2k\\pi
          \\end{cases}\\]
        </div>
      </div>
    `
  },

  {
    tag: 'APPROFONDIMENTO',
    title: 'Equazioni <em>lineari</em> in seno e coseno',
    nav: 'Lineari',
    body: `
      <p class="section-intro">Questo è il tipo di equazione che più frequentemente incontrerai in problemi reali. Il metodo dell'angolo aggiunto è una tecnica potentissima usata in telecomunicazioni, acustica e nelle analisi di circuiti AC.</p>

      <div class="cb method">
        <div class="cb-label">Forma generale</div>
        <div class="math-block">\\[a\\sin x + b\\cos x + c = 0 \\quad (a \\neq 0, \\, b \\neq 0)\\]</div>
      </div>

      <h3>Metodo dell'angolo aggiunto</h3>
      <p>La chiave è trasformare la combinazione lineare in una sola funzione.</p>

      <div class="cb tip">
        <div class="cb-label">Trasformazione</div>
        <div class="math-block">\\[a\\sin x + b\\cos x = A\\sin(x + \\varphi)\\]</div>
        <p style="margin-top:12px;">dove:</p>
        <ul>
          <li>\\(A = \\sqrt{a^2 + b^2}\\) (ampiezza)</li>
          <li>\\(\\sin \\varphi = \\dfrac{b}{A}\\) e \\(\\cos \\varphi = \\dfrac{a}{A}\\) (angolo di sfasamento)</li>
        </ul>
      </div>

      <div class="cb success">
        <div class="cb-label">Esempio 1</div>
        <p><strong>Equazione:</strong></p>
        <div class="math-block">\\[\\sqrt{3}\\sin x - \\cos x - 1 = 0\\]</div>

        <div class="step-math"><div class="label">Passo 1</div>Calcoliamo \\(A\\) e \\(\\varphi\\)</div>
        <div class="math-block">
          \\[A = \\sqrt{(\\sqrt{3})^2 + (-1)^2} = \\sqrt{3 + 1} = 2\\]
        </div>
        <div class="math-block">
          \\[\\sin \\varphi = \\frac{-1}{2}, \\quad \\cos \\varphi = \\frac{\\sqrt{3}}{2} \\quad \\Rightarrow \\quad \\varphi = -\\frac{\\pi}{6}\\]
        </div>

        <div class="step-math"><div class="label">Passo 2</div>Riscriviamo l'equazione</div>
        <div class="math-block">
          \\[2\\sin\\left(x - \\frac{\\pi}{6}\\right) - 1 = 0 \\quad \\Rightarrow \\quad \\sin\\left(x - \\frac{\\pi}{6}\\right) = \\frac{1}{2}\\]
        </div>

        <div class="step-math"><div class="label">Passo 3</div>Risolviamo come equazione elementare</div>
        <div class="math-block">
          \\[\\begin{cases}
            x - \\dfrac{\\pi}{6} = \\dfrac{\\pi}{6} + 2k\\pi \\Rightarrow x = \\dfrac{\\pi}{3} + 2k\\pi \\\\
            x - \\dfrac{\\pi}{6} = \\pi - \\dfrac{\\pi}{6} + 2k\\pi \\Rightarrow x = \\pi + 2k\\pi
          \\end{cases}\\]
        </div>
      </div>
    `
  },

  {
    tag: 'AVANZATO',
    title: 'Equazioni <em>omogenee</em> di 2° grado',
    nav: 'Omogenee',
    body: `
      <p class="section-intro">Qui affrontiamo il livello più astratto, ma con una struttura elegante: niente termini noti, solo combinazioni di seno e coseno. La chiave è dividere per cos²x e trasformare tutto in tangente. Usato in ottimizzazione e in alcuni problemi di geometria.</p>

      <div class="cb method">
        <div class="cb-label">Forma generale</div>
        <div class="math-block">\\[a\\sin^2 x + b\\sin x \\cos x + c\\cos^2 x = 0\\]</div>
      </div>

      <h3>Metodo di risoluzione</h3>
      <p>Se \\(\\cos x \\neq 0\\), dividiamo l'intera equazione per \\(\\cos^2 x\\) e otteniamo un'equazione di 2° grado in \\(\\tan x\\).</p>

      <div class="cb warn">
        <div class="cb-label">Attenzione</div>
        <p>Bisogna verificare a parte se \\(\\cos x = 0\\) (cioè \\(x = \\dfrac{\\pi}{2} + k\\pi\\)) è soluzione dell'equazione originale.</p>
      </div>

      <div class="cb success">
        <div class="cb-label">Esempio 1</div>
        <p><strong>Equazione:</strong></p>
        <div class="math-block">\\[\\sin^2 x - 3\\sqrt{3}\\sin x \\cos x + 6\\cos^2 x = 0\\]</div>

        <div class="step-math"><div class="label">Passo 1</div>Verifichiamo se \\(\\cos x = 0\\) è soluzione</div>
        <p>Se \\(\\cos x = 0\\), allora \\(\\sin x = \\pm 1\\), quindi \\(\\sin^2 x = 1\\):</p>
        <div class="math-block">\\[1 - 0 + 0 = 1 \\neq 0\\]</div>
        <p>Non è soluzione.</p>

        <div class="step-math"><div class="label">Passo 2</div>Dividiamo per \\(\\cos^2 x\\)</div>
        <div class="math-block">\\[\\tan^2 x - 3\\sqrt{3}\\tan x + 6 = 0\\]</div>

        <div class="step-math"><div class="label">Passo 3</div>Risolviamo l'equazione di 2° grado</div>
        <div class="math-block">
          \\[\\tan x = \\frac{3\\sqrt{3} \\pm \\sqrt{27 - 24}}{2} = \\frac{3\\sqrt{3} \\pm \\sqrt{3}}{2}\\]
        </div>
        <div class="math-block">
          \\[\\tan x = \\sqrt{3} \\quad \\text{oppure} \\quad \\tan x = 2\\sqrt{3}\\]
        </div>

        <div class="step-math"><div class="label">Passo 4</div>Ricaviamo le soluzioni</div>
        <div class="math-block">
          \\[\\begin{cases}
            \\tan x = \\sqrt{3} \\Rightarrow x = \\dfrac{\\pi}{3} + k\\pi \\\\
            \\tan x = 2\\sqrt{3} \\Rightarrow x = \\arctan(2\\sqrt{3}) + k\\pi
          \\end{cases}\\]
        </div>
      </div>
    `
  },

  {
    tag: 'VERIFICA',
    title: 'Checklist di <em>autocontrollo</em>',
    nav: 'Checklist',
    body: `
      <p class="section-intro">Completa gli item mentre studi. Non è uno sprint: ogni checkmark significa che hai compreso davvero quel concetto.</p>

      <div class="checklist-grid">
        <div class="checklist-group">
          <h4>Fondamenti</h4>
          <ul>
            <li>Definizione di equazione goniometrica</li>
            <li>Tre formule risolutive (seno, coseno, tangente)</li>
            <li>Risolvere \\(\\sin x = p\\) per qualsiasi \\(p\\)</li>
            <li>Risolvere \\(\\cos x = q\\) per qualsiasi \\(q\\)</li>
            <li>Risolvere \\(\\tan x = h\\) per qualsiasi \\(h\\)</li>
          </ul>
        </div>

        <div class="checklist-group">
          <h4>Riconducibili</h4>
          <ul>
            <li>Sostituzione \\(t = \\sin x\\) o \\(t = \\cos x\\)</li>
            <li>Riconoscere quando usare una formula</li>
            <li>Tornare alla variabile originale \\(x\\)</li>
            <li>Verificare le soluzioni trovate</li>
          </ul>
        </div>

        <div class="checklist-group">
          <h4>Lineari</h4>
          <ul>
            <li>Metodo dell'angolo aggiunto</li>
            <li>Calcolare \\(A = \\sqrt{a^2 + b^2}\\)</li>
            <li>Trovare l'angolo \\(\\varphi\\)</li>
            <li>Trasformare in \\(A\\sin(x + \\varphi)\\)</li>
          </ul>
        </div>

        <div class="checklist-group">
          <h4>Omogenee</h4>
          <ul>
            <li>Riconoscere equazione omogenea di 2°</li>
            <li>Verificare se \\(\\cos x = 0\\) è soluzione</li>
            <li>Dividere per \\(\\cos^2 x\\)</li>
            <li>Risolvere l'equazione in \\(\\tan x\\)</li>
          </ul>
        </div>
      </div>
    `
  }
];

const topNav = document.getElementById('topNav');
const app = document.getElementById('app');
let currentSection = 0;

sections.forEach((sec, i) => {
  const btn = document.createElement('button');
  btn.className = 'nav-pill' + (i === 0 ? ' active' : '');
  btn.textContent = sec.nav;
  btn.onclick = () => showSection(i);
  topNav.appendChild(btn);
});

function showSection(i) {
  currentSection = i;
  const sec = sections[i];

  app.innerHTML = `
    <section class="section active">
      <div class="hero">
        <div class="hero-tag">${sec.tag}</div>
        <h1>${sec.title}</h1>
      </div>
      ${sec.body}
    </section>
  `;

  document.querySelectorAll('.nav-pill').forEach((p, idx) => {
    p.classList.toggle('active', idx === i);
  });

  document.querySelectorAll('.acc-header').forEach(h => {
    h.onclick = function() {
      this.classList.toggle('active');
      this.nextElementSibling.classList.toggle('active');
    };
  });

  // Checklist interattiva
  document.querySelectorAll('.checklist-group li').forEach(li => {
    li.onclick = function(e) {
      e.stopPropagation();
      this.classList.toggle('checked');
    };
  });

  MathJax.typesetPromise().catch(err => console.log(err));
  window.scrollTo(0, 0);
}

showSection(0);
document.body.style.opacity = '1';
</script>

</body>
</html>
